name: Stock Alerts

on:
  schedule:
    # 장중에만 돈다. 30분 간격이고 GitHub Actions 예약은 수십 분씩 밀릴 수 있으므로,
    # 이건 "실시간 트레이딩 알림"이 아니라 "크게 움직였다는 걸 알려주는" 용도다.
    #
    # 한국장 KST 09:00~15:30 = UTC 00:00~06:30 (평일)
    - cron: '*/30 0-6 * * 1-5'
    # 미국 정규장 KST 22:30~05:00 = UTC 13:30~20:00. 서머타임에 한 시간 밀리므로
    # 앞뒤로 넉넉히 잡는다 — 장 밖 시간에 돌아도 전일 종가 대비라 값이 안 바뀌어 무해하다.
    - cron: '*/30 13-20 * * 1-5'
  workflow_dispatch:
    inputs:
      test_push:
        description: '급변동 여부와 무관하게 테스트 알림을 한 번 보낸다 (구독을 다시 등록한 뒤 확인용)'
        type: boolean
        default: false

permissions:
  contents: write

# 30분 간격이라 앞 실행과 겹칠 일은 드물지만, 겹치면 alerts/ 커밋이 충돌한다.
concurrency:
  group: stock-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check for big moves
        id: check
        env:
          # 앱의 "알림 종목 내보내기"로 만든 목록. 없으면 WATCH 만 감시한다.
          ALERT_SYMBOLS: ${{ secrets.ALERT_SYMBOLS }}
          # 저장소 Variables 에서 조절 (Settings → Secrets and variables → Variables).
          ALERT_THRESHOLD: ${{ vars.ALERT_THRESHOLD }}
        run: node scripts/check-alerts.js

      # 발송과 무관하게 "지금 시크릿에 들어 있는 구독의 지문"을 기록해 둔다 (daily.yml 과 같은 이유).
      # 장중 30분마다 도는 덕에, 시크릿을 갱신하면 앱의 경고가 30분 안에 풀린다.
      - name: Record push subscription state
        id: pushstate
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          # 앱이 구독을 직접 등록해 두는 워커. 이게 있으면 시크릿보다 우선한다 —
          # 구독이 바뀌어도 사람이 시크릿을 옮겨 적을 필요가 없다.
          PUSH_STORE_URL: ${{ vars.PUSH_STORE_URL }}
          PUSH_STORE_ADMIN_TOKEN: ${{ secrets.PUSH_STORE_ADMIN_TOKEN }}
        run: node scripts/push-state.js

      # 서비스워커가 alerts/latest.json 을 읽어 알림 문구를 만들기 때문에,
      # 반드시 커밋·배포가 끝난 뒤에 푸시를 보내야 한다.
      # 급변동이 없어도 돈다 — push/ 지문이 바뀌었을 수 있고, 그때는 알림보다 이 커밋이 먼저다.
      - name: Commit alerts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alerts/ push/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            if [ "${{ steps.check.outputs.alerted }}" = "true" ]; then
              git commit -m "alert: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            else
              git commit -m "push: 구독 지문 갱신"
            fi
            git pull --rebase --autostash
            git push
          fi

      # Pages 배포가 끝나야 서비스워커가 새 alerts/latest.json 을 읽는다.
      # 크론 자체가 이미 수십 분 밀리는 마당이라 이 1분 반은 문제가 되지 않는다.
      # 확인 발송 때도 기다린다 — 서비스워커가 방금 커밋된 push/state.json 의 status 0 을
      # 읽어야 "알림 다시 연결됨" 으로 띄운다.
      - name: Wait for Pages deploy
        if: steps.check.outputs.alerted == 'true' || steps.pushstate.outputs.verify == 'true'
        run: sleep 90

      - name: Send push notification
        if: steps.check.outputs.alerted == 'true'
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          # 앱이 구독을 직접 등록해 두는 워커. 이게 있으면 시크릿보다 우선한다 —
          # 구독이 바뀌어도 사람이 시크릿을 옮겨 적을 필요가 없다.
          PUSH_STORE_URL: ${{ vars.PUSH_STORE_URL }}
          PUSH_STORE_ADMIN_TOKEN: ${{ secrets.PUSH_STORE_ADMIN_TOKEN }}
        run: node scripts/send-push.js

      # 새 구독이 정말 폰까지 가는지 확인하는 발송. 두 경우에 돈다:
      #  - push-state.js 가 아직 발송해 본 적 없는 구독을 발견했을 때 (verify=true).
      #    구독은 앱·서비스워커가 스스로 워커 보관소에 갈아끼우므로 사람 눈에 안 띈 채 바뀐다.
      #    바뀐 자리에서 한 번 쏴 보지 않으면, 그 구독이 죽은 것이어도 다음 발송 기회까지
      #    아무도 모른다 (2026-08-14 에 아홉 시간을 그렇게 날렸다 — push-state.js 주석 참고).
      #  - 수동 실행에서 스위치를 켰을 때. 크론으로는 절대 켜지지 않는다.
      # 급변동 발송이 이미 돌았으면 그게 곧 확인이므로 건너뛴다.
      - name: Send verification push
        if: steps.check.outputs.alerted != 'true' && (steps.pushstate.outputs.verify == 'true' || (github.event_name == 'workflow_dispatch' && inputs.test_push))
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          # 앱이 구독을 직접 등록해 두는 워커. 이게 있으면 시크릿보다 우선한다 —
          # 구독이 바뀌어도 사람이 시크릿을 옮겨 적을 필요가 없다.
          PUSH_STORE_URL: ${{ vars.PUSH_STORE_URL }}
          PUSH_STORE_ADMIN_TOKEN: ${{ secrets.PUSH_STORE_ADMIN_TOKEN }}
        run: node scripts/send-push.js

      # 위 두 발송 스텝 중 무엇이 돌았든 그 결과를 배포한다. always() 여야 한다 — 410 이면
      # 발송 스텝이 워크플로를 실패시키는데, 바로 그때의 기록이 앱에 가장 필요한 값이다.
      - name: Commit push send result
        if: always()
        run: |
          git add push/
          if git diff --staged --quiet; then
            echo "푸시 상태 변화 없음 — 커밋 생략"
          else
            git commit -m "push: 발송 상태 갱신"
            git pull --rebase --autostash
            git push
          fi
