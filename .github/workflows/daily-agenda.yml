name: Daily Agenda (Calendar & Mail)

on:
  schedule:
    # 시장 브리핑과 달리 정규장 마감 시점에 얽매일 필요가 없어 market 워크플로와
    # 살짝 어긋난 시각으로 잡는다(둘은 독립된 workflow라 실제로 겹쳐도 문제는 없다).
    - cron: '5 21 * * *'    # KST 06:05
    - cron: '45 21 * * *'   # KST 06:45
    - cron: '25 22 * * *'   # KST 07:25
    - cron: '5 23 * * *'    # KST 08:05
  workflow_dispatch:        # 버튼으로 수동 실행도 가능 (테스트용)

permissions:
  contents: write           # 생성된 JSON을 저장소에 커밋

concurrency:
  group: daily-agenda
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate today's agenda
        id: gen
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: node scripts/generate-agenda.js

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agenda/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            DATE="${{ steps.gen.outputs.date }}"
            if [ -z "$DATE" ]; then
              DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
            fi
            git commit -m "agenda: $DATE"
            git pull --rebase --autostash
            git push
          fi
