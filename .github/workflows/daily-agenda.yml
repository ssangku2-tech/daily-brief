name: Daily Agenda (Calendar + Mail)

on:
  schedule:
    # 재시도용 — GitHub Actions 예약 실행은 밀리거나 아예 건너뛸 수 있다.
    # generate-agenda.js는 그날 파일이 이미 있으면 바로 건너뛰므로, 여러 번
    # 걸어둬도 실제로 생성하는 건 처음 성공한 한 번뿐이다.
    - cron: '0 21 * * *'    # KST 06:00 (미국 브리핑과 같은 시각)
    - cron: '40 21 * * *'   # KST 06:40
    - cron: '20 22 * * *'   # KST 07:20
    - cron: '0 23 * * *'    # KST 08:00
  workflow_dispatch:        # 수동 실행 (테스트용)

permissions:
  contents: write

# 재시도 스케줄이 앞 실행과 겹치면 둘 다 "파일 없음"으로 보고 동시에 생성해
# push가 충돌한다. 큐에 세워 한 번에 하나씩만 돌린다.
concurrency:
  group: daily-agenda
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate today's agenda
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-agenda.js

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agenda/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "agenda: $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
