name: Daily Market Briefing

on:
  schedule:
    # 미국 정규장 마감(동부 16:00)은 서머타임에 따라 UTC 20:00(EDT) ~ 21:00(EST).
    # 겨울에도 마감 뒤에 돌도록 첫 실행은 UTC 21:30(= KST 06:30)으로 잡는다.
    #
    # 아래 세 개는 재시도용이다. GitHub Actions 의 예약 실행은 부하에 따라
    # 수십 분씩 밀리거나 아예 건너뛰고, 실행 자체가 실패할 수도 있다.
    # generate.js 는 그날 파일이 이미 있으면 바로 건너뛰므로, 여러 번 걸어둬도
    # 실제로 생성하는 건 처음 성공한 한 번뿐이다.
    - cron: '30 21 * * *'   # KST 06:30
    - cron: '10 22 * * *'   # KST 07:10
    - cron: '50 22 * * *'   # KST 07:50
    - cron: '30 23 * * *'   # KST 08:30
  workflow_dispatch:        # 버튼으로 수동 실행도 가능 (테스트용)

permissions:
  contents: write           # 생성된 JSON을 저장소에 커밋

# 재시도 스케줄이 앞 실행과 겹치면 둘 다 "파일 없음"으로 보고 동시에 생성해
# push 가 충돌한다. 큐에 세워 한 번에 하나씩만 돌린다.
concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate today's briefing
        id: gen
        env:
          # 뉴스 한국어 요약·선별용 (haiku 1회). 없으면 요약 없이 원문 그대로 생성된다 —
          # 즉 키가 빠져도 워크플로가 깨지지는 않는다.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate.js

      # 발송과 무관하게 "지금 시크릿에 들어 있는 구독의 지문"을 기록해 둔다. 앱이 이 값을
      # 자기 구독과 비교해 어긋남을 스스로 알아챈다. 시크릿을 갱신했을 때 앱의 경고가
      # 다음 실행에서 풀리는 것도 이 스텝 덕분이다(발송을 기다리면 하루가 걸릴 수 있다).
      - name: Record push subscription state
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: node scripts/push-state.js

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefings/ push/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            # generate.js 가 넘겨준 KST 날짜를 쓴다. 못 받았을 때만 직접 계산한다.
            DATE="${{ steps.gen.outputs.date }}"
            if [ -z "$DATE" ]; then
              DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
            fi
            git commit -m "briefing: $DATE"
            # 재시도 실행이 앞 실행과 겹쳤을 때를 대비해 원격을 먼저 반영한다.
            git pull --rebase --autostash
            git push
          fi

      # 커밋·푸시가 끝난 뒤에 쏜다 — 알림을 받고 앱을 열었을 때 새 브리핑이 이미
      # 배포돼 있어야 하기 때문. 새로 생성한 실행에서만 보내므로 재시도 크론이
      # 네 번 돌아도 알림은 하루 한 번이다.
      - name: Send push notification
        if: steps.gen.outputs.generated == 'true'
        env:
          # 공개키는 시크릿이 아니다 — send-push.js 가 index.html 에서 직접 읽는다.
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: node scripts/send-push.js

      # send-push.js 가 남긴 발송 결과를 배포한다. always() 여야 한다 — 410 이면 위 스텝이
      # 워크플로를 실패시키는데, 바로 그때의 기록이 앱에 가장 필요한 값이다.
      - name: Commit push send result
        if: always()
        run: |
          git add push/
          if git diff --staged --quiet; then
            echo "푸시 상태 변화 없음 — 커밋 생략"
          else
            git commit -m "push: 발송 상태 갱신"
            git pull --rebase --autostash
            git push
          fi
