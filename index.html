// ====== 일정 섹션 ======
// events[].start 는 "14:00" 같은 HH:MM 문자열, allDay 날짜 문자열("2026-08-02"),
// 또는 타임존이 포함된 ISO 시각 세 가지를 다 지원한다. ISO면 나머지 시간 유틸과
// 동일한 +9h 오프셋 방식으로 KST 시:분/날짜를 뽑아낸다.
function fmtEventTime(ev){
  if(ev.allDay) return '종일';
  const s = String(ev.start||'');
  if(/^\d{1,2}:\d{2}$/.test(s)) return s;
  const d = new Date(s);
  if(isNaN(d)) return s;
  const kst = new Date(d.getTime() + 9*3600*1000);
  return `${String(kst.getUTCHours()).padStart(2,'0')}:${String(kst.getUTCMinutes()).padStart(2,'0')}`;
}
// 이벤트가 속한 KST 날짜 키(YYYY-MM-DD). allDay는 이미 날짜만 담겨있고, 시간이 있으면
// +9h 오프셋으로 KST 날짜를 계산한다. 판단 불가하면 빈 문자열.
function eventDateKey(ev){
  const s = String(ev.start||'');
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(s);
  if(isNaN(d)) return '';
  return new Date(d.getTime() + 9*3600*1000).toISOString().slice(0,10);
}
// "오늘"/"내일" 라벨. 그 외 날짜는 짧은 날짜로 표기(생성 스크립트가 오늘·내일만
// 가져오지만, 방어적으로 처리).
function eventDayLabel(ev){
  const key = eventDateKey(ev);
  if(!key) return '';
  if(key === todayKST()) return '오늘';
  if(key === kstDateKeyOffset(1)) return '내일';
  return fmtShortDate(key);
}
// 날짜 → (종일 우선) 시간 순으로 정렬하기 위한 문자열 키
function eventSortKey(ev){
  const dateKey = eventDateKey(ev) || '9999-99-99';
  let timeRank;
  if(ev.allDay){
    timeRank = -1;
  } else {
    const m = /^(\d{1,2}):(\d{2})$/.exec(fmtEventTime(ev));
    timeRank = m ? (+m[1])*60 + (+m[2]) : 9999;
  }
  return `${dateKey}|${String(timeRank + 1).padStart(5,'0')}`;
}
function renderSchedule(a){
  // 실시간으로 받은 일정이 있으면 그걸 쓴다. 아침 파일은 실패했을 때의 폴백이다.
  // (빈 배열도 "일정이 없다"는 정상 결과이므로 liveEvents 존재 여부로만 판단한다.)
  const le = state.liveEvents;
  const source = le ? le.events : (a && a.events);
  let inner;
  let events = [];
  if(!source){
    inner = `
      <div class="empty">
        <div class="big">🌙</div>
        <div class="msg">아직 일정 정보가 없어요</div>
      </div>` + googleConnectRow('일정', !!le);
  } else {
    // 낡은 파일로 폴백했다면 이미 지난 날짜의 일정이 섞여 있다 — 오늘 이후만 남긴다.
    // (날짜를 판단할 수 없는 항목은 버리지 않고 그대로 둔다.)
    const today = todayKST();
    events = source.filter(ev => {
      const k = eventDateKey(ev);
      return !k || k >= today;
    }).sort((x,y) => {
      const kx = eventSortKey(x), ky = eventSortKey(y);
      return kx < ky ? -1 : kx > ky ? 1 : 0;
    });
    // 실시간 일정을 받았다면 낡을 수가 없다 — 그때는 안내 대신 기준 시각만 밝힌다.
    const stale = le
      ? ''
      : (isAgendaStale()
          ? `<div class="stale">오늘 일정이 아직 생성되지 않아 ${esc(fmtShortDate(state.agendaDate))}자 정보를 보여주고 있어요. 그 이후에 추가·변경된 일정은 빠져 있습니다.</div>`
          : '');
    const items = events.map(ev => {
      const label = eventDayLabel(ev);
      return `
      <div class="event-row">
        <div class="event-time">${esc(fmtEventTime(ev))}</div>
        <div class="event-main">
          <div class="event-title">${esc(ev.title)}</div>
          ${ev.location ? `<div class="event-loc">📍 ${esc(ev.location)}</div>` : ''}
        </div>
        ${label ? `<div class="event-day">${esc(label)}</div>` : ''}
      </div>`;
    }).join('');
    // 동의 화면에서 캘린더만 체크를 뺐다면 조용히 아침 파일로 돌아가는 대신 이유를 밝힌다.
    const denied = (state.googleGrants && state.googleGrants.calendar === false)
      ? '<div class="stale">캘린더 읽기 권한에 동의하지 않아 아침에 만든 일정만 보여요.</div>' : '';
    inner = stale + denied + (items || `
      <div class="empty">
        <div class="big">📅</div>
        <div class="msg">예정된 일정이 없어요</div>
      </div>`) + googleConnectRow('일정', !!le);
  }

  // 카드를 펼치지 않아도 "오늘 몇 건인지"는 알 수 있어야 한다.
  const todayCount = events.filter(ev => eventDateKey(ev) === todayKST()).length;
  let sub = '';
  // 일정을 받아온 이상 "0건"도 사실이다 — 접힌 카드에 아무 말도 안 적어두면 데이터가
  // 없는 건지 일정이 없는 건지 구분이 안 된다.
  if(source) sub = todayCount ? `오늘 ${todayCount}건` : '오늘 일정 없음';
  // 보여줄 게 있을 때만 펼친 채로 시작한다 (빈 카드를 열어둘 이유가 없다)
  return cardShell('schedule', '📅', '일정', esc(sub), inner, events.length > 0);
}

// ====== 접속 시점 실시간 일정·메일 (Google API 직접 호출) ======
// agenda/*.json 은 그날 아침 06:00 스냅샷이라, 낮에 열면 안읽음 통수부터 틀리고 그 사이
// 잡힌 일정은 아예 없다. 그래서 브라우저에서 Calendar/Gmail API 를 직접 부른다 — 둘 다
// CORS 를 허용하므로 프록시가 필요 없다.
//
// 토큰은 하나로 둘 다 본다. 스코프를 나눠 두 번 받으면 동의 화면도 두 번 뜬다.
//
// 반드시 지킬 것 두 가지:
// 1) GOOGLE_REFRESH_TOKEN(=CI 가 쓰는 값)을 클라이언트로 내려보내지 말 것. 공개 Pages
//    사이트에 올리는 순간 누구나 이 사람의 메일·캘린더를 읽을 수 있다. 여기서 쓰는 건
//    브라우저 전용 토큰 플로우라 client_secret 도, refresh token 도 필요 없다.
//    client_id 는 공개돼도 되는 값이다(허용 출처로 잠긴다) — 그래서 그대로 커밋한다.
// 2) 중요 메일 한 줄 요약은 여기로 못 옮긴다. 그건 Claude 호출이고, 클라이언트에 API 키를
//    둘 수 없을 뿐 아니라 접속할 때마다 토큰이 나간다. 요약은 계속 아침 agenda 파일에서
//    오고, 이 실시간 경로는 "일정 + 안읽음 통수 + 최근 안 읽은 메일 제목"까지만 맡는다(비용 0).
//
// 값이 비어 있으면 이 기능 전체가 조용히 꺼진다 — Google Cloud Console 에서 "웹 애플리케이션"
// 유형 OAuth 클라이언트를 만들고(승인된 JavaScript 원본에 https://ssangku2-tech.github.io 추가)
// 그 클라이언트 ID 를 여기 채우면 켜진다. CI 가 쓰는 데스크톱 클라이언트로는 안 된다.
const GOOGLE_WEB_CLIENT_ID = '576621681088-iupfcj077kkju8ison962s0g19qtcb60.apps.googleusercontent.com';
// CI(setup-google-auth.js)와 같은 최소 스코프. 둘 다 읽기 전용이라 코드가 무슨 짓을 해도
// 일정을 고치거나 메일을 보낼 수 없다. gmail.metadata 를 gmail.readonly 로 올리지 말 것 —
// 그쪽은 Google 의 "제한된" 스코프라 보안 심사 없이는 테스트 상태를 못 벗어난다.
const GOOGLE_SCOPES = [
  'https://www.googleapis.com/auth/calendar.readonly',
  'https://www.googleapis.com/auth/gmail.metadata',
].join(' ');
const GMAIL_ON_KEY = 'mygmail_on_v1';   // localStorage: 실시간 연결을 켜 뒀는지
// localStorage: 액세스 토큰. sessionStorage 가 아닌 이유는 아래 googleToken 주석 참고 —
// 앱을 껐다 켜도 남아야 유효기간(1시간) 동안은 버튼을 다시 안 눌러도 된다. 읽기 전용
// 스코프 토큰이고 1시간이면 만료되지만, 그래도 로그·화면에 찍지 말 것.
const GMAIL_TOK_KEY = 'mygmail_tok_v1';
const GMAIL_MAX = 8;

let gisPromise = null;
function loadGis(){
  if(gisPromise) return gisPromise;
  gisPromise = new Promise((resolve, reject) => {
    if(window.google && window.google.accounts && window.google.accounts.oauth2) return resolve();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.onload = () => resolve();
    s.onerror = () => { gisPromise = null; reject(new Error('Google 로그인 스크립트를 불러오지 못했어요')); };
    document.head.appendChild(s);
  });
  return gisPromise;
}

function storedGmailToken(){
  try{
    const t = JSON.parse(localStorage.getItem(GMAIL_TOK_KEY) || 'null');
    if(t && t.token && t.exp > Date.now() + 60*1000){
      if(t.grants) state.googleGrants = t.grants;
      return t.token;
    }
  }catch(e){}
  return null;
}
function dropGmailToken(){
  try{ localStorage.removeItem(GMAIL_TOK_KEY); }catch(e){}
}

// 토큰 발급은 사용자가 버튼을 눌렀을 때(interactive)만 한다. 자동 갱신은 이미 받아둔
// 토큰이 살아 있을 때만 쓰고, 없으면 그냥 실패시킨다.
//
// 이게 이 파일에서 제일 헷갈리기 쉬운 부분이다: **GIS 토큰 클라이언트에는 조용한 경로가
// 없다.** `requestAccessToken({prompt:'none'})` 도 창을 먼저 띄우고 그 안에서 구글이
// 판단한다 — 동의가 이미 끝나 자동 승인되는 경우에도 창은 한 번 열렸다 닫힌다.
// 처음엔 prompt:'none' 을 자동 갱신에 걸어놨는데, 헤드리스로 확인해 보니 앱을 열 때마다
// 팝업이 떴다(게다가 사용자 제스처 없이 여는 팝업이라 실제 브라우저에선 차단되기 쉽다).
// 옛 gapi.auth2 의 숨은 iframe 재발급은 토큰 모델에 없다. 대안으로 남는 건 authorization
// code + PKCE 인데, 웹 유형 클라이언트는 코드 교환에 client_secret 을 요구하므로
// (그걸 클라이언트에 두는 건 절대 금지) 그 길도 막혀 있다.
//
// 그래서 토큰 수명(1시간) 안에서는 자동, 만료되면 카드의 버튼을 한 번 누르는 방식이다.
// 이미 동의한 계정이면 그 한 번도 동의 화면 없이 창이 깜빡하고 닫힌다.
async function googleToken(interactive){
  const cached = storedGmailToken();
  if(cached) return cached;
  if(!interactive){
    const e = new Error('실시간 연결이 만료됐어요');
    e.needAuth = true;
    throw e;
  }
  await loadGis();
  return new Promise((resolve, reject) => {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_WEB_CLIENT_ID,
      scope: GOOGLE_SCOPES,
      callback: r => {
        if(!r || r.error || !r.access_token){
          const e = new Error(r && (r.error_description || r.error) || '토큰 발급 실패');
          e.needAuth = true;
          return reject(e);
        }
        // 사용자가 동의 화면에서 일부 항목만 체크하면 토큰은 나오지만 그 API 는 403 이
        // 된다. 어느 쪽이 빠졌는지 여기서 알아둬야 카드가 "권한이 없다"고 말할 수 있다.
        const has = s => !google.accounts.oauth2.hasGrantedAllScopes
          ? true : google.accounts.oauth2.hasGrantedAllScopes(r, s);
        state.googleGrants = {
          calendar: has('https://www.googleapis.com/auth/calendar.readonly'),
          gmail: has('https://www.googleapis.com/auth/gmail.metadata'),
        };
        const exp = Date.now() + (Number(r.expires_in) || 3600) * 1000;
        try{ localStorage.setItem(GMAIL_TOK_KEY, JSON.stringify({token:r.access_token, exp, grants:state.googleGrants})); }catch(e){}
        resolve(r.access_token);
      },
      error_callback: err => {
        const e = new Error((err && err.type === 'popup_closed_by_user') ? '로그인 창이 닫혔어요' : '구글 로그인에 실패했어요');
        e.needAuth = true;
        reject(e);
      },
    });
    // prompt:'' = 이미 동의했으면 동의 화면을 다시 띄우지 않는다(창 자체는 뜬다).
    client.requestAccessToken({prompt:''});
  });
}

async function googleGet(url, token, what){
  const res = await fetch(url, {headers:{Authorization:`Bearer ${token}`}, cache:'no-store'});
  if(res.status === 401){
    // 만료된 토큰을 들고 계속 재시도하지 않도록 버린다. 다음에 버튼을 누르면 새로 받는다.
    dropGmailToken();
    const e = new Error(`${what} 접근 권한이 만료됐어요`);
    e.needAuth = true;
    throw e;
  }
  // 403 은 토큰을 버리지 않는다 — 만료가 아니라 그 스코프에 동의하지 않은 경우라,
  // 버리면 갱신할 때마다 토큰을 새로 받으면서 결과는 똑같이 403 이 된다.
  if(res.status === 403) throw new Error(`${what} 권한이 없어요`);
  if(!res.ok) throw new Error(`${what} ${res.status}`);
  return res.json();
}
const gmailGet = (path, token) =>
  googleGet(`https://gmail.googleapis.com/gmail/v1/users/me/${path}`, token, '메일');

// 오늘 00:00 ~ 내일 23:59 (KST) — generate-agenda.js 의 fetchEvents 와 같은 범위, 같은
// 결과 모양({title, start, allDay, location})이라 renderSchedule 이 구분 없이 그린다.
async function fetchLiveEvents(token){
  const params = new URLSearchParams({
    timeMin: new Date(`${todayKST()}T00:00:00+09:00`).toISOString(),
    timeMax: new Date(`${kstDateKeyOffset(1)}T23:59:59+09:00`).toISOString(),
    singleEvents: 'true',
    orderBy: 'startTime',
    maxResults: '50',
  });
  const d = await googleGet(
    `https://www.googleapis.com/calendar/v3/calendars/primary/events?${params}`, token, '일정');
  return (d.items || []).map(e => ({
    title: e.summary || '(제목 없음)',
    start: (e.start && (e.start.dateTime || e.start.date)) || '',
    allDay: !(e.start && e.start.dateTime),
    location: e.location || '',
  }));
}

// 안읽음은 labelIds 로 거른다 — gmail.metadata 스코프는 q= 검색 파라미터를 받지 않고
// 403 "Metadata scope does not support 'q' parameter" 로 죽는다(2026-08-10 확인).
// 여기도 q=is:unread 를 쓰고 있어서 실시간 메일이 08-07부터 계속 실패하고 있었는데,
// 실패가 조용히 아침 파일 폴백으로 흡수돼 눈에 띄지 않았다. q= 를 다시 넣지 말 것.
// 개수는 라벨의 messagesUnread — resultSizeEstimate 와 달리 추정치가 아니다.
async function fetchLiveMail(token){
  const [count, list] = await Promise.all([
    gmailGet('labels/INBOX', token),
    gmailGet(`messages?labelIds=UNREAD&labelIds=INBOX&maxResults=${GMAIL_MAX}`, token),
  ]);
  const ids = (list.messages || []).map(m => m.id);
  // 개별 조회는 병렬로. 실패한 건은 조용히 빠진다(목록 전체를 날릴 이유가 없다).
  const details = await Promise.all(ids.map(id => gmailGet(
    `messages/${id}?format=metadata&metadataHeaders=From&metadataHeaders=Subject`, token
  ).catch(() => null)));
  const mails = details.filter(Boolean).map(m => {
    const hs = (m.payload && m.payload.headers) || [];
    const pick = n => (hs.find(h => String(h.name).toLowerCase() === n) || {}).value || '';
    return {from: prettyFrom(pick('from')), subject: pick('subject') || '(제목 없음)', at: Number(m.internalDate) || 0};
  }).sort((x, y) => y.at - x.at);
  return {unread: count.messagesUnread || 0, mails, at: Date.now()};
}

// '"홍길동" <a@b.com>' → '홍길동' / 이름이 없으면 메일 주소 앞부분
function prettyFrom(v){
  const m = String(v||'').match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>\s*$/);
  const name = m ? m[1].trim() : '';
  const addr = m ? m[2] : String(v||'').trim();
  return name || addr.split('@')[0] || addr;
}
// 오늘 온 메일은 시각으로, 그 전 것은 날짜로 — 목록에서 "언제"를 한눈에 구분하려고
function fmtMailTime(ms){
  if(!ms) return '';
  const d = new Date(ms + 9*3600*1000);
  const key = d.toISOString().slice(0,10);
  if(key === todayKST()) return fmtClockKST(ms);
  return `${d.getUTCMonth()+1}/${d.getUTCDate()}`;
}

// interactive=true 는 사용자가 버튼을 눌렀을 때뿐이다. 자동 갱신 경로(interactive=false)는
// 이미 받아둔 토큰이 살아 있을 때만 조회하고 없으면 그냥 실패한다 — 창을 띄우지 않기
// 위해서다(googleToken 주석 참고: GIS 에는 창 없는 발급 경로가 없다).
//
// 일정과 메일은 토큰만 공유하고 결과는 따로 담는다 — 한쪽이 실패해도 다른 쪽은 실시간으로
// 뜨고, 실패한 쪽만 아침 agenda 파일로 되돌아간다.
async function loadGoogleLive(interactive){
  if(!GOOGLE_WEB_CLIENT_ID){ state.googleStatus = 'off'; return; }
  if(!interactive && localStorage.getItem(GMAIL_ON_KEY) !== '1'){ state.googleStatus = 'off'; return; }
  state.googleStatus = 'loading';
  state.googleError = '';
  if(interactive) render();
  try{
    const token = await googleToken(!!interactive);
    // 한쪽만 실패했을 때도 나머지는 살려야 하므로 예외를 삼키되, 둘 다 실패했을 때
    // "만료(다시 누르면 됨)"인지 "그냥 실패"인지는 구분해서 올린다 — 토큰이 1시간짜리라
    // 만료가 가장 흔한 경우이고, 그때 "받지 못했어요"라고만 하면 원인이 안 보인다.
    const settle = pr => pr.then(v => ({v}), e => ({e}));
    const [ev, mail] = await Promise.all([
      settle(fetchLiveEvents(token)),
      settle(fetchLiveMail(token)),
    ]);
    if(ev.e && mail.e){
      const expired = ev.e.needAuth || mail.e.needAuth;
      const e = new Error(expired ? '실시간 연결이 만료됐어요' : '일정·메일을 받지 못했어요');
      e.needAuth = !!expired;
      throw e;
    }
    // 빈 배열은 "일정이 없다"는 정상 결과다 — 실패(e)와 구분해서 담는다.
    if(ev.v) state.liveEvents = {events: ev.v, at: Date.now()};
    if(mail.v) state.liveMail = mail.v;
    state.googleStatus = 'ok';
    localStorage.setItem(GMAIL_ON_KEY, '1');
  }catch(e){
    // 직전에 받아둔 state.liveEvents/liveMail 은 지우지 않는다 — 있으면 그거라도 보여준다.
    state.googleStatus = (e && e.needAuth) ? 'need-auth' : 'fail';
    state.googleError = interactive ? String(e && e.message || '') : '';
  }
}

function connectGoogle(){
  loadGoogleLive(true).then(render);
}
function disconnectGoogle(){
  localStorage.removeItem(GMAIL_ON_KEY);
  dropGmailToken();
  state.liveEvents = null;
  state.liveMail = null;
  state.googleGrants = null;
  state.googleStatus = 'off';
  state.googleError = '';
  render();
}

// 일정·메일 카드가 같이 쓰는 연결 상태 줄. 클라이언트 ID 가 비어 있으면 아예 안 그린다
// (= 기능 꺼짐). 두 카드 중 어디서 눌러도 같은 토큰 하나를 받는다.
//
// 한 번 연결한 적이 있으면(GMAIL_ON_KEY) 문구를 "다시 연결"로 바꾼다 — 토큰이 1시간짜리라
// 이 버튼은 처음 한 번이 아니라 주기적으로 보게 되는데, 그때마다 "연결"이라고만 써 있으면
// 설정이 풀린 줄 알게 된다. 다시 누를 때는 동의 화면이 안 뜨고 창만 깜빡한다.
function googleConnectRow(what, hasLive){
  if(!GOOGLE_WEB_CLIENT_ID) return '';
  if(state.googleStatus === 'loading') return `<div class="stale">${esc(what)}을 받아오는 중…</div>`;
  if(state.googleStatus === 'ok') return '<button class="asset-reveal" onclick="disconnectGoogle()">실시간 연결 끄기</button>';
  const again = localStorage.getItem(GMAIL_ON_KEY) === '1';
  return `<button class="asset-reveal" onclick="connectGoogle()">${
      again ? '실시간으로 다시 불러오기' : '실시간 일정·메일 연결'}</button>`
    + (state.googleError ? `<div class="stale">${esc(state.googleError)}</div>` : '')
    + ((state.googleStatus === 'fail' && !hasLive)
        ? `<div class="stale">${esc(what)}을 실시간으로 받지 못했어요. 아래는 오늘 아침 기준입니다.</div>` : '');
}

// ====== 메일 섹션 ======
function renderMail(a){
  const lm = state.liveMail;
  // status 가 아니라 값의 유무로 판단한다 — 토큰이 만료돼도 직전에 받아둔 목록이
  // 아침 파일보다 최신이고, 블록 라벨이 기준 시각을 밝히므로 감추는 게 오히려 손해다.
  const liveOk = !!lm;
  const mails = (a && a.importantMails) || [];

  // 1) 중요 메일 — 한 줄 요약이 붙는 유일한 블록이라 계속 아침 agenda 파일에서 온다.
  // 실시간 목록이 있으면 "언제 기준인지"만 블록 라벨에 밝히고, 낡음 경고는 띄우지 않는다
  // (안읽음·최근 메일은 이미 실시간이라 경고할 대상이 요약뿐이라는 게 라벨로 드러난다).
  // 아침 파일의 from 은 'Google <noreply@…>' 원문이다. 바로 아래 실시간 목록과 표기를
  // 맞추려고 여기서도 prettyFrom 을 태운다(파일 형식은 그대로 두고 화면에서만 정리).
  const importantItems = mails.map(m => `
      <div class="news-item">
        <div class="news-title">${esc(prettyFrom(m.from))} — ${esc(m.subject)}</div>
        <div class="news-body">${esc(m.summary)}</div>
      </div>`).join('');
  const importantLabel = liveOk
    ? `중요 메일 (${esc(fmtShortDate(state.agendaDate) || '오늘')} 아침 요약)`
    : '중요 메일';
  const important = importantItems
    ? `<div class="block"><div class="block-label">${importantLabel}</div>${importantItems}</div>` : '';

  // 2) 최근 안 읽은 메일 — 접속 시점에 Gmail 에서 바로 받아온 목록. 요약은 없다(LLM 미호출).
  const recentItems = liveOk ? lm.mails.map(m => `
      <div class="news-item">
        <div class="news-title">${esc(m.subject)}</div>
        <div class="news-date">${esc([m.from, fmtMailTime(m.at)].filter(Boolean).join(' · '))}</div>
      </div>`).join('') : '';
  const recent = liveOk
    ? `<div class="block"><div class="block-label">안 읽은 메일 · ${esc(fmtClockKST(lm.at))} 기준</div>${
        recentItems || '<div class="news-body">안 읽은 메일이 없어요</div>'}</div>`
    : '';

  // 3) 일정 카드와 같은 연결 줄 — 토큰이 하나라 어느 쪽에서 눌러도 둘 다 켜진다.
  const denied = (state.googleGrants && state.googleGrants.gmail === false)
    ? '<div class="stale">메일 읽기 권한에 동의하지 않아 아침에 만든 요약만 보여요.</div>' : '';
  const connect = denied + googleConnectRow('메일', liveOk);

  let inner;
  if(!a && !liveOk){
    inner = `
      <div class="empty">
        <div class="big">🌙</div>
        <div class="msg">아직 메일 정보가 없어요</div>
      </div>` + connect;
  } else {
    // 실시간 목록이 있으면 안읽음 통수도 최근 메일도 지금 값이라, 낡았다고 경고할 게 없다.
    const stale = (!liveOk && isAgendaStale())
      ? `<div class="stale">${esc(fmtShortDate(state.agendaDate))}자 메일 정보입니다. 그 이후에 온 메일은 반영되지 않았어요.</div>`
      : '';
    const body = (important + recent) || `
      <div class="empty">
        <div class="big">📧</div>
        <div class="msg">안읽은 중요 메일이 없어요</div>
      </div>`;
    inner = stale + body + connect;
  }

  // 안읽음 통수는 실시간 값이 있으면 그걸 쓴다 — 카드를 접어둔 채로도 지금 통수가 보이도록.
  let sub = '';
  if(a || liveOk){
    const parts = [];
    if(mails.length) parts.push(`중요 ${mails.length}건`);
    const unread = liveOk ? lm.unread : (a && a.unreadCount);
    if(typeof unread === 'number') parts.push(`안읽음 ${unread}`);
    sub = parts.join(' · ');
  }
  return cardShell('mail', '📧', '메일', esc(sub), inner, mails.length > 0 || liveOk);
}
// 헤더 우측 상단 한 줄 — 시세와 뉴스는 갱신 주기가 다르므로(시세=접속 시점, 뉴스=매일 06:30)
// 둘을 한 덩어리로 뭉뚱그리지 않고 각각의 기준 시각을 밝힌다.
function updatedText(){
  const parts = [];
  if(state.quoteStatus === 'loading') parts.push('시세 받는 중…');
  else if(state.quoteStatus === 'ok' && state.live) parts.push(`시세 ${fmtClockKST(state.live.at)} 기준`);
  else if(state.live) parts.push(`시세 ${fmtClockKST(state.live.at)} (갱신 실패)`);
  else parts.push('시세 브리핑 종가');
  // 이 문자열은 textContent 로 들어가므로 esc() 가 필요 없다(HTML 템플릿에 끼워넣지 않는다)
  if(state.newsStatus === 'loading') parts.push('뉴스 받는 중…');
  else if(state.newsStatus === 'ok' && state.liveNews) parts.push(`뉴스 ${fmtClockKST(state.liveNews.at)} 기준`);
  else {
    const gen = state.briefing && state.briefing.generatedAt;
    if(gen) parts.push(`뉴스 ${String(gen).slice(5)} 브리핑`); // "2026-08-05 06:30" → "08-05 06:30"
  }
  return parts.join(' · ');
}

function render(){
  const key = todayKST();
  document.getElementById('greeting').textContent = greetingKST();
  document.getElementById('date').textContent = fmtDate(key);

  // 갱신 상태 (시세/뉴스 각각의 기준 시각)
  const upd = document.getElementById('updated');
  upd.style.display = 'flex';
  document.getElementById('updated-txt').textContent = updatedText();
  document.getElementById('updated-dot').className = 'dot' + (state.quoteStatus === 'ok' ? ' on' : '');

  // 지수 스트립 (항상 노출)
  document.getElementById('idx-strip').innerHTML = renderIndexStrip();

  // 새로고침 버튼 — 자동 갱신이 기본이라는 걸 버튼 자체가 설명한다
  document.getElementById('refresh').disabled = state.refreshing;
  document.getElementById('refresh-label').textContent = state.refreshing ? '갱신 중…' : '지금 새로고침';
  document.getElementById('refresh-sub').textContent = state.refreshing
    ? '시세·뉴스·일정·메일을 다시 받아오는 중'
    : (state.refreshedAt
        ? `${fmtAgo(state.refreshedAt)} 갱신됨 · 앱을 열면 자동 갱신`
        : '앱을 열면 자동으로 갱신됩니다');

  // 섹션 조립: 미국 시장(관심 종목·뉴스·앤트로픽) → 오늘 해야 할 일(일정·메일) → 학습 → 자산
  const sections = [
    renderUSBriefing(state.briefing),
    renderSchedule(state.agenda),
    renderMail(state.agenda),
    renderLearning(),
    renderAssets(),
  ];
  document.getElementById('sections').innerHTML = sections.join('');
  document.getElementById('push-slot').innerHTML = renderPushRow();
}

// ====== 데이터 로드 ======
async function loadBriefing(){
  const key = todayKST();
  state.shownDate = null;
  try{
    // 1) 오늘 브리핑 시도
    let res = await fetch(`briefings/${key}.json`, {cache:'no-store'});
    let shown = key;
    if(!res.ok){
      // 2) 오늘 게 아직 없으면 index.json에서 가장 최근 날짜를 찾아 시도
      const idx = await fetch('briefings/index.json', {cache:'no-store'});
      if(idx.ok){
        const dates = await idx.json();
        const latest = dates[dates.length - 1];
        if(latest){
          res = await fetch(`briefings/${latest}.json`, {cache:'no-store'});
          shown = latest;
        }
      }
    }
    state.briefing = res.ok ? await res.json() : null;
    state.shownDate = state.briefing ? (state.briefing.date || shown) : null;
  }catch(e){
    state.briefing = null;
    state.shownDate = null;
  }
  render();
}

// briefing과 독립적인 별도 fetch — 하나가 없거나 실패해도 다른 하나는 정상 표시된다.
// 오늘 파일이 없으면(크론이 아직 안 돌았거나 실패) 브리핑과 같은 방식으로 가장 최근
// 날짜로 되돌아간다. 일정에 한해서는 이 폴백이 꽤 쓸모 있다 — generate-agenda.js가
// 매번 "오늘+내일"을 담기 때문에, 어제자 파일에도 오늘 일정이 들어있다.
// (메일 쪽은 그렇지 않아서 낡은 값임을 화면에 분명히 밝힌다.)
async function loadAgenda(){
  const key = todayKST();
  state.agendaDate = null;
  try{
    let res = await fetch(`agenda/${key}.json`, {cache:'no-store'});
    let shown = key;
    if(!res.ok){
      const idx = await fetch('agenda/index.json', {cache:'no-store'});
      if(idx.ok){
        const dates = (await idx.json()).filter(d => d <= key).sort();
        const latest = dates[dates.length - 1];
        if(latest){
          res = await fetch(`agenda/${latest}.json`, {cache:'no-store'});
          shown = latest;
        }
      }
    }
    state.agenda = res.ok ? await res.json() : null;
    state.agendaDate = state.agenda ? (state.agenda.date || shown) : null;
  }catch(e){
    state.agenda = null;
    state.agendaDate = null;
  }
  render();
}
// 지금 띄운 일정·메일이 오늘(KST) 것이 아닌지
function isAgendaStale(){
  return !!state.agendaDate && state.agendaDate !== todayKST();
}

// ====== 갱신 오케스트레이션 ======
// 갱신 경로는 이 함수 하나뿐이다 — 시작할 때, 앱을 다시 앞으로 가져올 때, 버튼을 눌렀을 때
// 모두 여기로 들어온다. 어느 경로든 하는 일이 같아야 "새로고침을 눌러야 최신인가?" 하는
// 의심이 생기지 않는다.
// 비용: 이 함수가 부르는 건 Worker 시세 10건 + Worker 뉴스 9건(전체 2 + 종목 7) + 정적 JSON
// 2건 + 구글 번역 0~1건(새 제목이 있을 때만) + (실시간 메일을 켰다면) Gmail 10건 + (캐시
// 만료 시) 날씨 2건이고, LLM API는 한 번도 호출하지 않는다. 그래서 몇 번을 새로고침해도
// 토큰 비용은 0이다 — 늘려도 되는 건 이렇게 과금이 없는 호출뿐이라는 게 요점이다.
// 클라이언트에 Claude 를 붙이는 순간 이 계산이 깨진다.
async function refreshAll(force){
  if(state.refreshing) return;
  state.refreshing = true;
  render();
  await Promise.all([
    loadBriefing(),
    loadAgenda(),
    loadQuotes(),
    loadNews(),
    loadGoogleLive(false),
    loadWeather(force),
  ]);
  // 번역을 기다리느라 화면을 붙잡아 두지 않는다 — 받아온 것부터 먼저 그리고,
  // 번역이 도착하면 제목만 한국어로 바뀐다(실패하면 영어 제목 그대로 남는다).
  render();
  await translateNews();
  state.refreshing = false;
  state.refreshedAt = Date.now();
  render();
}

// ====== 이벤트 ======
document.getElementById('refresh').addEventListener('click', () => refreshAll(true));

// 홈 화면에 설치한 PWA는 한 번 띄우면 며칠씩 살아있는다 — 다시 앞으로 가져왔을 때
// 화면이 어제 값이면 안 되므로, 마지막 갱신이 3분보다 오래됐으면 자동으로 다시 받아온다.
const AUTO_REFRESH_AFTER = 3*60*1000;
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && Date.now() - state.refreshedAt > AUTO_REFRESH_AFTER){
    refreshAll();
  }
});

// ====== 아침 브리핑 알림 (웹 푸시) ======
// 공개키는 공개돼도 안전한 값이라 그대로 커밋한다(비밀키는 GitHub Secret 에만 둔다).
// 비어 있으면 알림 기능 전체가 조용히 숨겨진다 — scripts/setup-push.js 로 만들어 채운다.
const VAPID_PUBLIC_KEY = 'BDxDlUmSuwXF19pJwhvTsEB0qeGUUgAJ3mcBcocL3qj5Im5W4LK0Vg0O1qkneqTKDaix4OdQRmTBWYT9HIrvwLQ';

const pushSupported = () =>
  'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

function b64urlToUint8(s){
  const pad = '='.repeat((4 - s.length % 4) % 4);
  const raw = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}

// 이미 구독돼 있으면 그 정보를 state 에 담아둔다 (Secret 에 붙여넣을 수 있도록 다시 보여주기 위함)
async function refreshPushState(){
  if(!pushSupported() || !VAPID_PUBLIC_KEY) return;
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    state.pushSub = sub ? JSON.stringify(sub.toJSON()) : null;
  }catch(e){
    state.pushSub = null;
  }
  render();
}

async function enablePush(){
  state.pushError = '';
  try{
    // 권한 요청은 반드시 사용자의 클릭 직후여야 한다 — 자동 호출하면 브라우저가 무시한다.
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      state.pushError = '알림 권한이 허용되지 않았어요.';
      render();
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true, // 크롬은 이 옵션 없이는 구독을 거부한다
      applicationServerKey: b64urlToUint8(VAPID_PUBLIC_KEY),
    });
    state.pushSub = JSON.stringify(sub.toJSON());
  }catch(e){
    state.pushError = `구독에 실패했어요: ${e.message}`;
  }
  render();
}

function togglePushSub(){
  state.pushShowSub = !state.pushShowSub;
  if(!state.pushShowSub) state.pushCopied = false; // 다시 펼쳤을 때 "복사됨"이 남아있지 않도록
  render();
}

function copyPushSub(){
  if(!state.pushSub) return;
  navigator.clipboard.writeText(state.pushSub)
    .then(() => { state.pushCopied = true; render(); })
    .catch(() => { state.pushError = '복사에 실패했어요. 아래 상자에서 직접 선택해 복사해 주세요.'; render(); });
}

function renderPushRow(){
  if(!VAPID_PUBLIC_KEY) return '';           // 아직 키를 안 넣었으면 아예 감춘다
  if(!pushSupported()) return '';            // 지원 안 하는 브라우저
  const perm = Notification.permission;

  if(perm === 'denied'){
    return `<div class="push-row"><span class="push-msg">알림이 차단돼 있어요. 브라우저 설정에서 이 사이트의 알림을 허용해 주세요.</span></div>`;
  }
  if(!state.pushSub){
    return `<div class="push-row">
      <button class="push-btn" onclick="enablePush()">🔔 아침 브리핑 알림 받기</button>
      ${state.pushError ? `<span class="push-msg">${esc(state.pushError)}</span>` : ''}
    </div>`;
  }
  // 구독 완료 상태. 구독 JSON 은 GitHub Secret 에 한 번 넣고 나면 다시 볼 일이 없으므로
  // 접어둔다 — 상시 노출하면 설정이 끝난 뒤에도 화면 아래에 계속 남아 거슬린다.
  // 기기를 바꾸거나 Secret 을 다시 등록할 때만 펼치면 된다.
  return `<div class="push-row">
    <div class="push-status">
      <span class="push-msg">🔔 아침 브리핑 알림 켜짐</span>
      <button class="push-link" onclick="togglePushSub()">${state.pushShowSub ? '접기' : '구독 정보'}</button>
    </div>
    ${state.pushShowSub ? `
      <span class="push-msg">GitHub Secret <code>PUSH_SUBSCRIPTION</code> 에 넣을 값입니다. 이미 등록했다면 다시 넣지 않아도 됩니다.</span>
      <textarea class="push-sub" readonly onclick="this.select()">${esc(state.pushSub)}</textarea>
      <button class="push-btn" onclick="copyPushSub()">${state.pushCopied ? '복사됨 ✓' : '구독 정보 복사'}</button>` : ''}
    ${state.pushError ? `<span class="push-msg">${esc(state.pushError)}</span>` : ''}
  </div>`;
}

// ====== 서비스워커 등록 ======
// v0.3 까지 sw.js 는 저장소에 파일로만 있고 이 등록 코드가 없어서 한 번도 동작하지
// 않았다 — 오프라인 지원도, 캐시 버전(daily-brief-vN) 도 실제로는 아무 효과가 없었다.
// 앱 셸을 네트워크 우선으로 바꾼 뒤에야 켜는 게 맞다. 캐시 우선인 채로 켰다면 배포가
// 매번 한 박자 늦게 반영됐을 것이다.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(() => refreshPushState())  // 이미 구독돼 있으면 그 상태를 반영한다
      .catch(() => {});                // 실패해도 앱 동작에는 지장 없다
  });
}

// ====== 시작 ======
refreshAll();
</script>
