<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>My Agent</title>
<link rel="manifest" href="manifest.json">
<style>
  /* ===== 디자인 토큰 ===== */
  :root{
    --bg:#0b1020;          /* 딥 네이비-블랙 배경 */
    --bg-card:#141a2e;     /* 카드 배경 */
    --bg-card-2:#1b2340;   /* 카드 내부 강조 영역 */
    --line:#242d4a;        /* 구분선 */
    --tx:#e8ecf7;          /* 기본 텍스트 */
    --tx-dim:#8b93ad;      /* 흐린 텍스트 */
    --tx-faint:#5a627a;    /* 아주 흐린 텍스트 (placeholder 대비 확보용) */
    --up:#ff7a6e;          /* 상승 = 빨강 (한국 관습). 어두운 네이비 위에서 읽히도록 밝게 */
    --down:#6aa4ff;        /* 하락 = 파랑. --up 과 밝기를 맞춘다 */
    --amber:#f0b429;       /* 포인트 (갱신 시각·강조) */
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    line-height:1.5;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 16px}

  /* ===== 헤더 ===== */
  header{padding:20px 0 10px}
  /* 오늘 날짜가 헤더에서 가장 먼저 눈에 들어와야 하므로 가장 큰 글씨로 둔다 */
  .date-big{font-size:28px;font-weight:800;letter-spacing:-.5px}
  .greeting-row{
    display:flex;align-items:center;gap:8px;
    margin-top:4px;font-size:13px;color:var(--tx-dim)
  }
  .app-ver{
    margin-left:auto;font-size:11px;color:var(--tx-dim);
    border:1px solid var(--line);border-radius:20px;padding:2px 8px
  }
  /* 날씨는 알약형 배지로 감싸 인사말 줄과 분리한다. 지역명·현재기온은 헤더에서 날짜 다음으로
     자주 보는 정보라 다른 보조 텍스트보다 확실히 크게 둔다(최고/최저만 한 단계 작게). */
  .weather-pill{
    display:inline-flex;align-items:center;gap:9px;flex-wrap:wrap;
    margin-top:10px;color:var(--tx);
    background:var(--bg-card-2);border-radius:22px;padding:9px 16px
  }
  .weather-ico{font-size:24px;line-height:1}
  .weather-place{font-size:17px;font-weight:700;letter-spacing:-.3px}
  .weather-temp{font-size:17px;font-weight:700}
  .weather-range{font-size:13px;font-weight:600;color:var(--tx-dim)}

  /* 갱신 상태는 참고 정보일 뿐이라 눈에 띄지 않도록 우측 정렬 + 흐린 색으로 둔다.
     dot 색으로 실시간 시세를 받았는지(초록)/못 받았는지(회색)를 구분한다. */
  .updated{
    display:flex;justify-content:flex-end;align-items:center;gap:5px;
    font-size:11px;color:var(--tx-faint);margin-top:8px
  }
  .updated .dot{width:5px;height:5px;border-radius:50%;background:var(--tx-faint);flex-shrink:0}
  /* --up(빨강)은 이 앱에서 "상승"을 뜻하는 색이라 상태 표시에 쓰면 오독된다 — 포인트색을 쓴다 */
  .updated .dot.on{background:var(--amber)}

  /* ===== 지수 스트립 (카드를 펼치지 않아도 항상 보이는 3개 지수) ===== */
  .idx-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .idx-chip{
    background:var(--bg-card);border:1px solid var(--line);
    border-radius:12px;padding:9px 10px;min-width:0
  }
  .idx-chip .nm{
    font-size:11px;color:var(--tx-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .idx-chip .pr{font-size:15px;font-weight:700;letter-spacing:-.3px;margin-top:2px}
  .idx-chip .pc{font-size:12px;font-weight:700;margin-top:1px}

  /* ===== 섹션 카드 ===== */
  .card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-top:10px;
    overflow:hidden;
  }
  .card-head{
    display:flex;align-items:center;gap:8px;flex-wrap:nowrap;
    padding:12px 16px;border-bottom:1px solid var(--line);
    cursor:pointer;user-select:none
  }
  .card-head .ico{font-size:18px;flex-shrink:0}
  /* 제목은 카드 헤더가 좁아져도 줄바꿈되지 않고 한 줄을 유지한다 */
  .card-head .title{font-size:15px;font-weight:600;white-space:nowrap;flex-shrink:0}
  /* sub 는 제목보다 뒤로 밀리는 쪽이라 좁을 때 줄바꿈 대신 말줄임표로 처리 */
  .card-head .head-right{
    margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden
  }
  .card-head .sub{
    font-size:12px;color:var(--tx-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  /* 접기/펼치기 상태를 한눈에 알아볼 수 있도록 화살표를 크게 둔다 */
  .card-head .chevron{font-size:26px;line-height:1;color:var(--tx-dim);flex-shrink:0}
  .card-body{padding:14px 16px}

  /* ===== 빈 상태 (1단계 핵심) ===== */
  .empty{
    text-align:center;padding:28px 16px;color:var(--tx-dim)
  }
  .empty .big{font-size:30px;margin-bottom:8px;opacity:.7}
  .empty .msg{font-size:14px;line-height:1.6}
  .empty .hint{font-size:12px;color:var(--tx-faint);margin-top:10px}

  /* ===== 오늘의 한 줄 (haiku가 쓴 한 문장) ===== */
  .summary{
    font-size:14px;line-height:1.6;font-weight:600;color:var(--tx);
    background:var(--bg-card-2);border-radius:var(--radius-sm);
    padding:12px 14px;margin-bottom:12px
  }

  /* ===== 지난 날짜 브리핑을 대신 띄웠을 때의 안내 ===== */
  .stale{
    font-size:12px;line-height:1.5;color:var(--amber);
    background:var(--bg-card-2);border-radius:var(--radius-sm);
    padding:10px 12px;margin-bottom:10px
  }

  /* ===== 블록(지수/뉴스/종목/하이라이트 묶음) ===== */
  .block{margin-top:14px}
  .block:first-child{margin-top:6px}
  .block-label{
    font-size:12px;font-weight:600;color:var(--tx-dim);
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px
  }

  /* ===== 등락률 (관심 종목 행에서 공용) ===== */
  /* 등락률은 색만으로 버티기엔 작고 얇아서 잘 안 읽힌다 — 크기·굵기도 함께 준다 */
  .idx-chg{font-size:13px;font-weight:600;min-width:64px;text-align:right}
  .up{color:var(--up)}
  .down{color:var(--down)}
  /* up 이 true/false 가 아닌 경우(시세 확인 실패) — 빨강/파랑 어느 쪽으로도 읽히면 안 된다 */
  .flat{color:var(--tx-dim)}

  /* ===== 관심 종목 (한 종목 = 작은 블록: 위 시세 한 줄 + 아래 관련 뉴스 최대 2건) ===== */
  /* 구분선으로 나열하면 종목마다 뉴스 2줄이 붙는 순간 어디까지가 한 종목인지 흐려진다.
     그래서 종목별로 배경을 깐 블록으로 묶고, 뉴스는 점 불릿 + 2줄 말줄임으로 눌러둔다. */
  .stk{
    background:var(--bg-card-2);border-radius:var(--radius-sm);
    padding:10px 12px;margin-top:8px
  }
  .stk:first-child{margin-top:0}
  .stk-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .stk-name{font-size:14px;font-weight:600;min-width:0}
  .stk-name .tkr{font-size:11px;font-weight:500;color:var(--tx-dim);margin-left:5px}
  .stk-vals{display:flex;gap:8px;align-items:baseline;white-space:nowrap;flex-shrink:0}
  .stk-price{font-size:14px;font-weight:600}
  .stk-news{margin-top:7px;display:flex;flex-direction:column;gap:5px}
  .stk-news a{
    position:relative;padding-left:10px;
    font-size:12px;line-height:1.45;color:var(--tx-dim);text-decoration:none;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
  }
  .stk-news a::before{
    content:'';position:absolute;left:0;top:.55em;
    width:3px;height:3px;border-radius:50%;background:var(--tx-faint)
  }
  .stk-news a:active{color:var(--tx)}
  .stk-news .src{color:var(--tx-faint);margin-left:5px}
  .stk-note{font-size:12px;line-height:1.5;color:var(--tx-faint);margin-top:5px}

  /* ===== 뉴스·하이라이트 항목 ===== */
  /* 원문(영문) 헤드라인은 길어서 굵은 14px로 두면 카드 하나가 화면 몇 개 분량이 된다.
     종목별 뉴스와 위계를 맞춰 한 단계 줄이고 3줄에서 자른다. */
  .news-item{padding:7px 0;border-bottom:1px solid var(--line)}
  .news-item:last-child{border-bottom:none}
  .news-title{font-size:13px;font-weight:600;line-height:1.45;color:var(--tx);margin-bottom:3px}
  .news-title a{
    color:inherit;text-decoration:none;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden
  }
  .news-title a:hover,.news-title a:focus{text-decoration:underline}
  .news-body{font-size:13px;line-height:1.6;color:var(--tx-dim)}
  .news-date{font-size:11px;color:var(--tx-faint);margin-top:3px}

  /* ===== 일정 항목 ===== */
  /* 시간을 별도 칸으로 떼어내 제목과 섞이지 않게 한다 — 제목 자체에 시각이
     들어있는 이벤트("화산CC 13:00" 등)와 겹쳐 보이는 걸 막기 위함 */
  .event-row{
    display:flex;align-items:flex-start;gap:12px;
    padding:8px 0;border-bottom:1px solid var(--line)
  }
  .event-row:last-child{border-bottom:none}
  .event-time{
    flex:0 0 44px;font-size:13px;font-weight:600;color:var(--tx-dim);
    white-space:nowrap;padding-top:1px
  }
  .event-main{flex:1;min-width:0}
  .event-title{font-size:14px;color:var(--tx);line-height:1.4}
  .event-loc{font-size:12px;color:var(--tx-dim);margin-top:2px}
  .event-day{
    flex:0 0 auto;font-size:11px;font-weight:600;color:var(--amber);
    background:var(--bg-card-2);border-radius:20px;padding:2px 8px;white-space:nowrap
  }

  /* ===== 자산 (보유 종목 · 평가액 · 손익) ===== */
  .asset-total{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    background:var(--bg-card-2);border-radius:var(--radius-sm);
    padding:11px 13px;margin-bottom:8px
  }
  .asset-total-label{font-size:12px;color:var(--tx-dim);white-space:nowrap}
  .asset-total-vals{text-align:right;min-width:0}
  .asset-total-value{font-size:17px;font-weight:700;letter-spacing:-.3px}
  .asset-total-pl{display:block;font-size:12px;font-weight:600;margin-top:2px}
  .asset-total-note{display:block;font-size:10px;color:var(--tx-faint);margin-top:2px}
  .asset-row{
    display:flex;align-items:center;gap:10px;
    padding:9px 0;border-bottom:1px solid var(--line)
  }
  .asset-row:last-of-type{border-bottom:none}
  .asset-main{flex:1;min-width:0}
  /* 이름이 길어도 줄바꿈으로 행이 높아지지 않게 자른다 — 세 칸이 한 줄에 들어가야 한다 */
  .asset-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .asset-sub{font-size:11px;color:var(--tx-dim);margin-top:2px}
  /* 가운데 칸: 현재가·전일 대비·당일 손익. 오른쪽 칸과 같은 3줄이라 행 높이는 그대로다 */
  .asset-mid{text-align:right;white-space:nowrap;flex-shrink:0}
  .asset-price{font-size:13px;font-weight:600;color:var(--tx-dim)}
  .asset-day{font-size:11px;font-weight:600;margin-top:1px}
  .asset-vals{text-align:right;white-space:nowrap;flex-shrink:0}
  .asset-value{font-size:14px;font-weight:600}
  .asset-pl{font-size:12px;font-weight:600;margin-top:1px}
  .asset-pct{font-size:11px;font-weight:600;margin-top:1px}
  /* 삭제는 실수로 누르기 쉬운 자리라 평소엔 눈에 띄지 않게 두고 탭 영역만 확보한다 */
  .asset-del{
    flex-shrink:0;width:30px;height:30px;border-radius:50%;
    border:none;background:transparent;color:var(--tx-faint);
    font-size:14px;cursor:pointer;line-height:1
  }
  .asset-del:active{background:var(--bg-card-2);color:var(--tx)}
  /* 금액 펼치기 — 눈에 띄되 주된 행동은 아니므로 테두리만 있는 얌전한 버튼 */
  .asset-reveal{
    display:block;width:100%;margin-top:10px;
    background:transparent;color:var(--tx-dim);
    border:1px dashed var(--line);border-radius:var(--radius-sm);
    padding:9px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer
  }
  .asset-reveal:active{background:var(--bg-card-2);color:var(--tx)}
  /* 금액 보기 PIN 입력 — 포트폴리오 앱의 잠금과 같은 비밀번호를 받는다 */
  .pin-box{margin-top:10px;padding:10px 12px;background:var(--bg-card-2);border-radius:var(--radius-sm)}
  .pin-label{font-size:11px;color:var(--tx-dim);margin-bottom:8px}
  .pin-row{display:flex;gap:6px}
  .pin-in{
    min-width:0;flex:1;background:var(--bg);color:var(--tx);
    border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:9px 10px;font-size:16px;letter-spacing:8px;text-align:center;font-family:inherit
  }
  .pin-in::placeholder{color:var(--tx-faint);letter-spacing:8px}
  .pin-in:focus{outline:none;border-color:var(--amber)}
  .pin-cancel{
    flex-shrink:0;background:transparent;color:var(--tx-dim);
    border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:9px 14px;font-size:13px;font-family:inherit;cursor:pointer
  }
  .pin-cancel:active{background:var(--bg-card);color:var(--tx)}
  .pin-err{margin-top:8px;font-size:11px;color:var(--amber)}
  .asset-form{display:flex;gap:6px;margin-top:12px}
  .asset-in{
    min-width:0;flex:1;background:var(--bg-card-2);color:var(--tx);
    border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:9px 10px;font-size:13px;font-family:inherit
  }
  .asset-in::placeholder{color:var(--tx-faint)}
  .asset-in:focus{outline:none;border-color:var(--amber)}
  .asset-add{
    flex-shrink:0;background:var(--amber);color:var(--bg);border:none;
    border-radius:var(--radius-sm);padding:9px 14px;
    font-size:13px;font-weight:700;font-family:inherit;cursor:pointer
  }
  .asset-add:active{opacity:.85}

  /* ===== 링크 점프 (다른 앱으로 이동) ===== */
  .jump{
    display:flex;align-items:center;gap:12px;
    text-decoration:none;color:inherit;
    background:var(--bg-card-2);border-radius:var(--radius-sm);
    padding:14px 16px
  }
  .jump:active{background:#232c50}
  .jump-main{flex:1;min-width:0}
  .jump-title{font-size:14px;font-weight:600;color:var(--tx)}
  .jump-sub{font-size:12px;color:var(--tx-dim);margin-top:2px}
  .jump-arrow{font-size:18px;color:var(--amber);flex-shrink:0}

  /* ===== 새로고침 버튼 =====
     앱을 열 때/다시 앞으로 가져올 때 자동으로 갱신되므로 이 버튼은 "필요할 때 한 번 더"용이다.
     그래서 버튼 자체가 마지막 갱신 시각을 함께 들고 있어야 눌러야 할지 판단할 수 있다. */
  .refresh{
    display:block;width:100%;margin-top:18px;
    background:var(--bg-card-2);color:var(--tx);
    border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:11px 13px;font-size:14px;font-weight:600;cursor:pointer;
    font-family:inherit;line-height:1.35
  }
  .refresh:active{background:#232c50}
  .refresh:disabled{opacity:.6;cursor:default}
  .refresh .rf-sub{display:block;font-size:11px;font-weight:500;color:var(--tx-dim);margin-top:2px}

  /* ===== 알림 구독 ===== */
  .push-row{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .push-btn{
    width:100%;background:var(--bg-card-2);color:var(--tx);
    border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:11px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer
  }
  .push-btn:active{background:#232c50}
  .push-msg{font-size:11px;line-height:1.5;color:var(--tx-dim)}
  /* 설정이 끝난 뒤의 기본 모습 — 상태 한 줄과 펼치기 링크만 남는다 */
  .push-status{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .push-link{
    flex-shrink:0;background:none;border:none;color:var(--tx-faint);
    font-size:11px;font-family:inherit;cursor:pointer;
    padding:4px 6px;text-decoration:underline
  }
  .push-link:active{color:var(--tx)}
  .push-msg code{background:var(--bg-card-2);border-radius:4px;padding:1px 4px;font-size:10px}
  /* 구독 JSON 은 한 번 복사하면 끝이라 넓게 둘 이유가 없다 — 접힌 느낌으로 작게 */
  .push-sub{
    width:100%;height:56px;resize:vertical;
    background:var(--bg-card-2);color:var(--tx-dim);
    border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:8px;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace
  }

  /* ===== 오늘의 학습 ===== */
  .study-row{
    display:flex;align-items:center;gap:12px;
    padding:8px 0;border-bottom:1px solid var(--line)
  }
  .study-row:last-child{border-bottom:none}
  .study-link{
    flex:1;min-width:0;display:flex;align-items:center;gap:10px;
    text-decoration:none;color:inherit
  }
  .study-ico{font-size:22px;flex-shrink:0}
  .study-info{min-width:0;display:flex;flex-direction:column;gap:2px}
  .study-name{font-size:14px;font-weight:600;color:var(--tx);display:flex;align-items:center;gap:6px}
  .study-status{font-size:12px;color:var(--tx-dim)}
  .study-status.done{color:var(--up)}

<script>
// ====== 상태 ======
let state = {
  briefing: null,   // briefings/YYYY-MM-DD.json 의 내용을 그대로 담는다
  shownDate: null,  // 실제로 화면에 띄운 브리핑의 날짜 (오늘 것이 없으면 과거 날짜가 들어온다)
  agenda: null,     // agenda/YYYY-MM-DD.json 의 내용을 그대로 담는다
  agendaDate: null, // 실제로 띄운 일정·메일의 날짜 (오늘 것이 없으면 과거 날짜가 들어온다)
  live: null,       // 접속 시점에 Worker에서 직접 받아온 시세 {indices, stocks, at}
  quoteStatus: 'idle', // 'idle' | 'loading' | 'ok' | 'fail' — 시세만의 상태 (뉴스와 별개)
  liveNews: null,   // 접속 시점에 Worker 프록시로 받아온 뉴스 {news, aiNews, byTicker, at}
  newsStatus: 'idle',  // 'idle' | 'loading' | 'ok' | 'fail'
  liveMail: null,   // 접속 시점에 Gmail API 에서 직접 받아온 메일 {unread, mails, at}
  liveEvents: null, // 접속 시점에 Calendar API 에서 직접 받아온 일정 {events, at}
  googleStatus: 'idle', // 'idle' | 'off' | 'loading' | 'ok' | 'fail' | 'need-auth' — 일정·메일 공통
  googleError: '',
  googleGrants: null,   // {calendar, gmail} — 동의 화면에서 일부만 체크했을 때를 구분한다
  refreshedAt: 0,   // 마지막 갱신 완료 시각 (epoch ms)
  refreshing: false,
  assetForm: {ticker:'', qty:'', avg:''}, // 자산 카드 입력 폼 (render 가 DOM 을 다시 그려도 값이 남도록)
  assetError: '',
  pushSub: null,    // 웹 푸시 구독 JSON (GitHub Secret 에 넣을 값)
  pushError: '',
  pushCopied: false,
  pushShowSub: false, // 구독 JSON 을 펼쳐 보고 있는지 (설정 끝나면 접어둔다)
  assetsRevealed: false, // 자산 금액을 펼쳐 보고 있는지. 일부러 localStorage 에 두지 않는다
  pinPrompt: false,      // 금액 보기 전에 PIN 입력창을 띄운 상태인지
  pinInput: '',          // 입력 중인 PIN (render 가 DOM 을 다시 그려도 값이 남도록 state 에 둔다)
  pinError: '',
  alertCopied: false,    // 급변동 알림 종목 목록을 복사했는지
};

// ====== 유틸 ======
function todayKST(){
  const now = new Date(Date.now() + 9*3600*1000);
  return now.toISOString().slice(0,10);
}
// 한국 시간(KST) 기준 현재 '시(hour)'
function hourKST(){
  return new Date(Date.now() + 9*3600*1000).getUTCHours();
}
// 시간대에 맞는 인사 문구 + 이모지
function greetingKST(){
  const h = hourKST();
  if(h >= 5  && h < 11) return '좋은 아침이에요 ☕';   // 05~10시
  if(h >= 11 && h < 14) return '점심 잘 챙기세요 🍚';  // 11~13시
  // 날씨 아이콘(🌤️ 등)과 겹쳐 보이지 않도록 시간대 이모지는 날씨 계열을 피한다
  if(h >= 14 && h < 18) return '좋은 오후예요 😊';    // 14~17시
  if(h >= 18 && h < 23) return '좋은 저녁이에요 🌆';   // 18~22시
  return '늦은 시간이네요 🌙';                          // 23~04시
}
function fmtDate(key){
  const [y,m,d] = key.split('-');
  const wd = ['일','월','화','수','목','금','토'][new Date(key+'T00:00:00+09:00').getDay()];
  return `${y}년 ${+m}월 ${+d}일 (${wd})`;
}
// "2026-07-30" → "7월 30일"
function fmtShortDate(key){
  if(!key) return '';
  const [,m,d] = key.split('-');
  return `${+m}월 ${+d}일`;
}
// 지금 띄운 브리핑이 오늘(KST) 것이 아닌지
function isStale(){
  return !!state.shownDate && state.shownDate !== todayKST();
}
function esc(s){
  return String(s??'').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
// epoch ms → KST "HH:MM"
function fmtClockKST(ms){
  const d = new Date(ms + 9*3600*1000);
  return `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
}
// epoch ms → "방금 전" / "12분 전" / "14:05" — 갱신이 얼마나 오래됐는지 감을 주기 위한 표기
function fmtAgo(ms){
  if(!ms) return '';
  const sec = Math.floor((Date.now() - ms)/1000);
  if(sec < 60) return '방금 전';
  if(sec < 3600) return `${Math.floor(sec/60)}분 전`;
  return fmtClockKST(ms);
}

// ====== 접속 시점 실시간 시세 (Cloudflare Worker) ======
// 브리핑 JSON(매일 06:30 생성)의 시세는 하루 종일 고정이라, 낮에 열어보면 이미 낡은 값이다.
// 그래서 "내 주식 현황" 포트폴리오 앱과 같은 방식으로 앱을 열 때마다 이 Worker에서 직접
// 시세를 받아 덮어쓴다. Worker는 Access-Control-Allow-Origin:* 이라 브라우저에서 바로 호출된다.
// (뉴스도 2026-08-07부터 같은 Worker의 프록시 엔드포인트로 접속 시점에 받아온다 — 아래
//  "접속 시점 실시간 뉴스" 참고. 브리핑 JSON 은 이제 오프라인·실패 시의 폴백이다.)
const WORKER_URL = 'https://stock-proxy.ssangku2.workers.dev';
// name 은 generate.js 의 INDICES/WATCH 와 반드시 같아야 한다 — 브리핑 JSON 과 이름/티커로
// 짝을 맞춰 시세만 갈아끼우기 때문이다. short 는 스트립 칩에 들어갈 짧은 표기.
const INDICES = [
  { name:'S&P 500',   short:'S&P 500', symbol:'^GSPC' },
  { name:'나스닥종합', short:'나스닥',  symbol:'^IXIC' },
  { name:'다우존스',   short:'다우',    symbol:'^DJI'  },
];
// re 는 종목 뉴스 골라내기용이다 — Worker 의 종목 뉴스는 야후 티커 피드라 같은 섹터의
// 일반 기사가 그대로 섞여 들어온다(엔비디아 칸에 정유주 기사가 오는 식). 티커만으로는
// 못 거른다: MU 는 대학, AMD 는 황반변성 기사에 걸린다.
const WATCH = [
  { name:'엔비디아',      ticker:'NVDA', re:/nvidia|nvda/i },
  { name:'AMD',          ticker:'AMD',  re:/\bamd\b|advanced micro/i },
  { name:'인텔',          ticker:'INTC', re:/\bintel\b|intc/i },
  { name:'TSMC',         ticker:'TSM',  re:/tsmc|taiwan semi/i },
  { name:'마이크론',      ticker:'MU',   re:/micron/i },
  { name:'SK하이닉스 ADR', ticker:'SKHY', re:/hynix|하이닉스/i },
  { name:'팔란티어',      ticker:'PLTR', re:/palantir|pltr/i },
];

async function fetchQuote(symbol){
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch(`${WORKER_URL}/?symbol=${encodeURIComponent(symbol)}`,
      {cache:'no-store', signal:ctrl.signal});
    clearTimeout(timer);
    if(!res.ok) return null;
    const d = await res.json();
    if(d.price == null || d.prev == null) return null;
    return d;
  }catch(e){
    return null; // 개별 심볼 실패는 흔한 일 — 조용히 브리핑 JSON 값으로 폴백한다
  }
}
// 지수는 통화 기호 없이, 종목은 $를 붙여 표기한다 (generate.js 와 동일한 관례)
function fmtQuotePrice(price, currency){
  const n = price.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  return currency === 'USD' ? `$${n}` : n;
}
function fmtQuotePct(price, prev){
  const pct = ((price - prev) / prev) * 100;
  return `${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%`;
}

async function loadQuotes(){
  state.quoteStatus = 'loading';
  // 보유 종목 중 WATCH 에 없는 티커도 같이 받아온다 — 자산 카드가 쓸 시세다.
  // Worker 호출이라 몇 개 늘어도 비용은 0이고, 한 번에 묶어 받아야 요청이 흩어지지 않는다.
  const base = [...INDICES.map(i => i.symbol), ...WATCH.map(s => s.ticker)];
  const held = effectiveHoldings().list;
  const extra = held.map(h => h.symbol).filter(s => s && !base.includes(s));
  // 원화 환산이 필요한 경우에만 환율 심볼을 끼워 넣는다 (해외 종목이 하나도 없으면 불필요)
  if(held.some(h => !/^\d{6}\.KS$/.test(h.symbol))) extra.push('KRW=X');
  const symbols = [...base, ...new Set(extra)];
  const quotes = await Promise.all(symbols.map(fetchQuote));
  const toRow = (q, extra) => ({
    ...extra,
    price: fmtQuotePrice(q.price, extra.ticker ? q.currency : null),
    changePct: fmtQuotePct(q.price, q.prev),
    up: q.price >= q.prev,
  });

  const indices = [], stocks = [];
  INDICES.forEach((i, n) => {
    const q = quotes[n];
    if(q) indices.push(toRow(q, {name:i.name}));
  });
  WATCH.forEach((s, n) => {
    const q = quotes[INDICES.length + n];
    if(q) stocks.push(toRow(q, {name:s.name, ticker:s.ticker}));
  });

  // 자산 계산은 서식이 붙은 문자열("$211.94")이 아니라 원본 숫자가 필요하므로 따로 담아둔다
  const bySymbol = {};
  symbols.forEach((sym, n) => { if(quotes[n]) bySymbol[sym] = quotes[n]; });

  if(indices.length || stocks.length){
    state.live = {indices, stocks, bySymbol, at: Date.now()};
    state.quoteStatus = 'ok';
  } else {
    state.quoteStatus = 'fail'; // 직전에 받아둔 state.live 는 지우지 않는다 (있으면 그거라도 보여준다)
  }
}
// 실시간 시세가 있으면 그걸, 없으면 브리핑 JSON 값을 쓴다 — 항목 단위로 각각 판단한다.
function quoteFor(list, keyName, keyValue, fallback){
  const hit = (list || []).find(x => x[keyName] === keyValue);
  return hit || fallback;
}

// ====== 접속 시점 실시간 뉴스 (Cloudflare Worker 경유) ======
// 예전에는 "뉴스는 브라우저에서 못 받는다"고 봤다 — Google News RSS 가 CORS 헤더를 주지
// 않기 때문이다. 그런데 시세용으로 쓰던 그 Worker 에 범용 프록시(`?url=`)와 종목 뉴스
// 엔드포인트(`?news=`)가 이미 있었다("내 주식 현황" 앱이 쓰는 것과 같은 것). 그래서 뉴스도
// 시세와 똑같이 앱을 열 때마다 받아온다. LLM 은 여전히 한 번도 부르지 않으므로 비용은 0이다.
//
// 다만 소스는 바뀌었다. Google News 는 Cloudflare 데이터센터 IP 를 봇으로 보고 503("Sorry...")
// 을 주므로 Worker 로 우회해도 못 읽는다 — 확인 완료. 그래서 CORS 우회가 필요한 두 블록은
// 직접 RSS 를 주는 곳으로 옮겼다. 새 피드를 넣기 전에 반드시
// `?url=<인코딩된 주소>` 로 한 번 찔러보고 진짜 XML 이 오는지 볼 것(Bing·Yahoo 뉴스 검색은
// RSS 를 끊고 HTML 을 준다).
// 마켓 피드 하나만 쓰면 하루에 몇 건 안 올라와 5건을 채우려다 일주일 전 기사까지 끌려온다.
// 그래서 갱신이 잦은 CNBC 대문 피드를 같이 받아 최신순으로 섞는다.
const NEWS_FEEDS = [
  'https://www.cnbc.com/id/20910258/device/rss/rss.html',    // CNBC 마켓
  'https://www.cnbc.com/id/100003114/device/rss/rss.html',   // CNBC 주요 뉴스
];
const AI_NEWS_FEED = 'https://techcrunch.com/tag/anthropic/feed/';              // TechCrunch 앤트로픽 태그
const AI_NEWS_RE = /anthropic|claude/i;   // 태그 피드에도 곁가지 기사가 섞여 들어온다
const NEWS_MAX = 5, AI_NEWS_MAX = 3, STOCK_NEWS_MAX = 2;

// RSS/Atom 을 받아 {title, link, date, source} 배열로. 파싱은 브라우저 내장 DOMParser 로
// 한다 — generate.js 는 Node 라 정규식 파서를 직접 짰지만, 여기서는 그럴 이유가 없다.
// 접속 시점에 20건 남짓을 한꺼번에 Worker 로 쏘다 보니 한 건이 조용히 비는 일이 있다.
// 그러면 그 블록만 어제 브리핑으로 되돌아가는데, 헤더는 "뉴스 지금 기준"이라 말하고 있어
// 어긋난다. Worker 가 피드를 캐시하므로 한 번 더 부르는 값은 사실상 공짜다.
async function fetchFeed(url, source){
  const items = await fetchFeedOnce(url, source);
  return items.length ? items : fetchFeedOnce(url, source);
}
async function fetchFeedOnce(url, source){
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 10000);
    const res = await fetch(`${WORKER_URL}/?url=${encodeURIComponent(url)}`,
      {cache:'no-store', signal:ctrl.signal});
    clearTimeout(timer);
    if(!res.ok) return [];
    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');
    if(xml.querySelector('parsererror')) return [];
    return [...xml.querySelectorAll('item, entry')].map(it => {
      const get = t => (it.querySelector(t)?.textContent || '').trim();
      const link = get('link') || it.querySelector('link')?.getAttribute('href') || '';
      const when = get('pubDate') || get('published') || get('updated');
      const d = when ? new Date(when) : null;
      const ok = d && !isNaN(d);
      return {
        title: get('title'),
        link,
        // date 는 화면 표기용(KST 날짜), ts 는 정렬용 — 같은 날 기사들의 순서까지 지키려면
        // 날짜 문자열만으로는 부족하다.
        date: ok ? new Date(d.getTime() + 9*3600*1000).toISOString().slice(0,10) : '',
        ts: ok ? d.getTime() : 0,
        source,
      };
    }).filter(n => n.title && n.link);
  }catch(e){
    return [];   // 뉴스 한 블록이 비는 건 조용히 브리핑 JSON 으로 폴백하면 되는 일이다
  }
}

// 종목 뉴스는 Worker 의 전용 엔드포인트를 쓴다 — 미국 티커는 야후, 국내 6자리 코드는
// 네이버에서 종목별로 골라 준다(포트폴리오 앱이 종목 상세에서 쓰는 것과 같은 경로).
async function fetchStockNews(ticker, re){
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 10000);
    const res = await fetch(`${WORKER_URL}/?news=${encodeURIComponent(ticker)}`,
      {cache:'no-store', signal:ctrl.signal});
    clearTimeout(timer);
    if(!res.ok) return [];
    const all = (res.status === 204 ? [] : ((await res.json()).news || []))
      .filter(n => n.title && n.link)
      .map(n => ({title: n.titleKo || n.title, link: n.link, source: n.office || '', date: ''}));
    // 회사 이름이 제목에 있는 기사를 먼저 채우고, 모자라면 나머지로 메운다. 완전히
    // 걸러내지는 않는다 — 종목별 뉴스가 통째로 비는 날이 잦은 게 원래 문제였다.
    const hit = re ? all.filter(n => re.test(n.title)) : all;
    const rest = all.filter(n => !hit.includes(n));
    return [...hit, ...rest].slice(0, STOCK_NEWS_MAX);
  }catch(e){
    return [];
  }
}

async function loadNews(){
  state.newsStatus = 'loading';
  const results = await Promise.all([
    ...NEWS_FEEDS.map(u => fetchFeed(u, 'CNBC')),
    fetchFeed(AI_NEWS_FEED, 'TechCrunch'),
    ...WATCH.map(s => fetchStockNews(s.ticker, s.re)),
  ]);
  const general = results.slice(0, NEWS_FEEDS.length).flat();
  const ai = results[NEWS_FEEDS.length];
  const perStock = results.slice(NEWS_FEEDS.length + 1);
  const byTicker = {};
  WATCH.forEach((s, n) => { if(perStock[n].length) byTicker[s.ticker] = perStock[n]; });

  // 피드는 발행순이 아니라 편집 순서로 온다 — 접속 시점에 받는 값인 만큼 최신순으로
  // 세워야 "지금 뉴스"라는 표시와 맞는다. 두 피드에 같은 기사가 겹치므로 링크로 중복 제거.
  const seen = new Set();
  const news = general
    .filter(n => !seen.has(n.link) && seen.add(n.link))
    .sort((a, b) => b.ts - a.ts)
    .slice(0, NEWS_MAX);
  const aiNews = ai.filter(n => AI_NEWS_RE.test(n.title)).slice(0, AI_NEWS_MAX);

  if(news.length || aiNews.length || Object.keys(byTicker).length){
    state.liveNews = {news, aiNews, byTicker, at: Date.now()};
    state.newsStatus = 'ok';
  } else {
    state.newsStatus = 'fail'; // 직전에 받아둔 state.liveNews 는 지우지 않는다
  }
}

// 아침 브리핑에는 haiku 가 붙여둔 한국어 한 줄(ko)이 있다. 실시간으로 받은 항목 중
// 같은 기사(제목 일치)에는 그 한국어를 그대로 얹어준다 — 새로 들어온 기사만 원문
// 그대로 나오고, 아침에 이미 요약된 기사는 한국어로 읽힌다. 클라이언트에서 LLM 을
// 부를 수는 없으므로(접속마다 토큰이 나간다) 이게 붙일 수 있는 한국어의 전부다.
function koMapOf(b){
  const map = new Map();
  const add = list => (list || []).forEach(n => { if(n.title && n.ko) map.set(n.title, n.ko); });
  if(b){
    add(b.news); add(b.aiNews);
    (b.stocks || []).forEach(s => add(s.news));
  }
  return map;
}

// ====== 제목 한국어 번역 (구글 번역 공개 엔드포인트, 키·과금 없음) ======
// 접속 시점에 받아오는 뉴스는 CNBC·TechCrunch 원문이라 제목이 영어다. 위 koMapOf 로 아침
// 브리핑의 ko 를 얹을 수 있는 건 그날 아침에 이미 있던 기사뿐이고, 새로 들어온 기사는 그대로
// 영어로 남는다. 그렇다고 클라이언트에서 Claude 를 부를 수는 없다 — 앱을 열 때마다 토큰이
// 나간다(generate.js 에서 Claude 를 걷어낸 것과 같은 문제가 접속 횟수만큼 커진다).
// 그래서 번역만 따로, 과금이 없는 경로로 붙였다. 2026-08-07 확인한 사실:
//  - `Access-Control-Allow-Origin: *` 라 브라우저에서 바로 부를 수 있다(프록시 불필요).
//  - `translate_a/t?client=dict-chrome-ex` 는 q 를 여러 개 받아 번역문 배열을 **순서대로**
//    돌려준다. 흔히 쓰는 `translate_a/single?client=gtx` 는 q 를 여러 개 줘도 첫 번째만
//    번역하므로 제목 수만큼 호출해야 한다 — 그래서 이쪽을 쓴다. 8건 한 번에 0.7초.
//  - 실패하면 원문 영어 제목이 그대로 나온다. 번역은 있으면 좋은 것이지 없으면 화면이
//    깨지는 것이 아니므로, 어떤 실패도 조용히 폴백만 하고 넘어간다.
const TRANSLATE_URL = 'https://translate.googleapis.com/translate_a/t';
const TRANS_KEY = 'mytrans_v1';
const TRANS_MAX = 400;      // localStorage 에 남겨둘 번역 개수
const TRANS_URL_MAX = 1600; // GET 한 번에 담을 쿼리 길이 상한(넘으면 나눠 보낸다)

function transCache(){
  try{ return JSON.parse(localStorage.getItem(TRANS_KEY)) || {}; }catch(e){ return {}; }
}
function transCacheSave(map){
  try{
    const keys = Object.keys(map);
    // 객체 키 순서 = 넣은 순서이므로, 넘치면 오래된 것부터 잘라낸다.
    const kept = keys.length > TRANS_MAX ? keys.slice(keys.length - TRANS_MAX) : keys;
    localStorage.setItem(TRANS_KEY, JSON.stringify(
      Object.fromEntries(kept.map(k => [k, map[k]]))));
  }catch(e){}
}
// 이미 한국어인 제목은 보내지 않는다 — 국내 종목 뉴스(네이버)와 Worker 가 titleKo 를 붙여준
// 미국 종목 뉴스가 여기 해당한다. 알파벳이 두 자 이상이고 한글이 없을 때만 번역 대상.
function needsKo(t){ return !!t && /[A-Za-z]{2}/.test(t) && !/[가-힣]/.test(t); }

// 제목 여러 개 → 번역문 배열(같은 순서). 실패하면 빈 배열.
async function translateBatch(titles){
  const qs = titles.map(t => 'q=' + encodeURIComponent(t)).join('&');
  const url = `${TRANSLATE_URL}?client=dict-chrome-ex&sl=en&tl=ko&${qs}`;
  // 직접 호출이 막히는 망(또는 일시적 차단)을 대비해 시세·뉴스에 쓰는 Worker 프록시로 한 번
  // 더 시도한다. 프록시 경로도 실제로 같은 응답을 준다(확인 완료).
  const out = await translateOnce(url) || await translateOnce(`${WORKER_URL}/?url=${encodeURIComponent(url)}`);
  return Array.isArray(out) ? out : [];
}
async function translateOnce(url){
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch(url, {cache:'no-store', signal:ctrl.signal});
    clearTimeout(timer);
    if(!res.ok) return null;
    return await res.json();
  }catch(e){
    return null;
  }
}

// 화면에 나갈 뉴스 제목 중 영어인 것을 모아 한 번에 번역해 각 항목의 koT 에 얹는다.
// 실시간 뉴스(state.liveNews)와 폴백용 브리핑(state.briefing) 양쪽을 함께 훑으므로,
// 실시간 경로가 실패해 아침 파일로 되돌아간 날에도 제목은 한국어로 보인다.
async function translateNews(){
  const items = [];
  const push = list => (list || []).forEach(n => { if(n && !n.koT && needsKo(n.title)) items.push(n); });
  const ln = state.liveNews;
  if(ln){ push(ln.news); push(ln.aiNews); Object.values(ln.byTicker).forEach(push); }
  const b = state.briefing;
  if(b){ push(b.news); push(b.aiNews); (b.stocks || []).forEach(s => push(s.news)); }
  if(!items.length) return;

  // 같은 제목이 두 번 나가지 않게 캐시를 먼저 씌우고, 남은 것만 실제로 번역한다.
  // 갱신을 눌러도 대개 새 기사 한두 건만 요청이 나간다.
  const cache = transCache();
  const todo = [];
  items.forEach(n => {
    if(cache[n.title]) n.koT = cache[n.title];
    else if(!todo.includes(n.title)) todo.push(n.title);
  });
  if(!todo.length) return;

  const chunks = [[]];
  let len = 0;
  todo.forEach(t => {
    const q = encodeURIComponent(t).length + 3;
    if(len + q > TRANS_URL_MAX && chunks[chunks.length - 1].length){ chunks.push([]); len = 0; }
    chunks[chunks.length - 1].push(t);
    len += q;
  });
  const results = await Promise.all(chunks.map(translateBatch));

  const got = {};
  chunks.forEach((c, i) => c.forEach((t, j) => {
    const ko = results[i][j];
    if(typeof ko === 'string' && ko.trim() && ko.trim() !== t) got[t] = ko.trim();
  }));
  if(!Object.keys(got).length) return;
  items.forEach(n => { if(got[n.title]) n.koT = got[n.title]; });
  transCacheSave({...cache, ...got});
}

// ====== 상단 날씨 (Open-Meteo, API 키 불필요) ======
// 위치 권한을 거부하거나 얻지 못하면 서울 좌표로 대신한다.
const SEOUL_COORDS = {lat:37.5665, lon:126.9780};
const WEATHER_ICON = {
  0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',
  51:'🌦️',53:'🌦️',55:'🌦️',56:'🌧️',57:'🌧️',
  61:'🌧️',63:'🌧️',65:'🌧️',66:'🌧️',67:'🌧️',
  71:'❄️',73:'❄️',75:'❄️',77:'🌨️',
  80:'🌦️',81:'🌦️',82:'🌦️',85:'🌨️',86:'🌨️',
  95:'⛈️',96:'⛈️',99:'⛈️',
};
function weatherIcon(code){
  return WEATHER_ICON[code] || '🌡️';
}
function getPosition(){
  return new Promise(resolve => {
    if(!navigator.geolocation){ resolve(SEOUL_COORDS); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat:pos.coords.latitude, lon:pos.coords.longitude}),
      () => resolve(SEOUL_COORDS),
      {timeout:5000, maximumAge:3600000}
    );
  });
}
// 위경도 → 지역명(한국어). API 키가 필요 없는 클라이언트용 역지오코딩 서비스를 쓴다.
// 실패해도 날씨 표시 자체는 지장이 없어야 하므로 빈 문자열로 조용히 폴백한다.
async function reverseGeocodeKo(lat, lon){
  try{
    const url = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ko`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('geocode fetch failed');
    const d = await res.json();
    return d.city || d.locality || d.principalSubdivision || '';
  }catch(e){
    return '';
  }
}
// 날씨는 몇 분 사이에 바뀌지 않는데 위치 권한 조회(getPosition)까지 매번 타면 앱을 열 때마다
// 눈에 띄게 느려진다. 그래서 마지막 결과를 localStorage 에 30분간 캐시해 두고, 캐시가 살아
// 있으면 네트워크를 전혀 건드리지 않는다 (수동 새로고침은 force 로 캐시를 무시한다).
const WEATHER_KEY = 'myweather_v1';
const WEATHER_TTL = 30*60*1000;
function paintWeather(w){
  const row = document.getElementById('weather-row');
  if(!w){ row.style.display = 'none'; return; }
  document.getElementById('weather-ico').textContent = w.icon;
  document.getElementById('weather-place').textContent = w.place || '';
  document.getElementById('weather-temp').textContent = `${w.now}°`;
  document.getElementById('weather-range').textContent = `최고 ${w.max}° · 최저 ${w.min}°`;
  row.style.display = 'inline-flex';
}
async function loadWeather(force){
  try{
    const cached = JSON.parse(localStorage.getItem(WEATHER_KEY) || 'null');
    if(cached && !force && Date.now() - cached.at < WEATHER_TTL){ paintWeather(cached); return; }
    if(cached) paintWeather(cached); // 새로 받아오는 동안 낡은 값이라도 먼저 띄운다

    const {lat, lon} = await getPosition();
    const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
      + `&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
    const [res, place] = await Promise.all([fetch(weatherUrl), reverseGeocodeKo(lat, lon)]);
    if(!res.ok) throw new Error('weather fetch failed');
    const d = await res.json();
    const w = {
      icon: weatherIcon(d.current.weather_code),
      place,
      now: Math.round(d.current.temperature_2m),
      max: Math.round(d.daily.temperature_2m_max[0]),
      min: Math.round(d.daily.temperature_2m_min[0]),
      at: Date.now(),
    };
    localStorage.setItem(WEATHER_KEY, JSON.stringify(w));
    paintWeather(w);
  }catch(e){
    // 새로 못 받아도 캐시가 있으면 그대로 두고, 아무것도 없을 때만 숨긴다
    let cached = null;
    try{ cached = JSON.parse(localStorage.getItem(WEATHER_KEY) || 'null'); }catch(e2){}
    paintWeather(cached);
  }
}

];
const STUDY_KEY = 'mystudy_log_v1'; // { "2026-07-30": {en:true, jp:false}, ... } 형태로 localStorage에 저장

function loadStudyLog(){
  try{
    return JSON.parse(localStorage.getItem(STUDY_KEY)) || {};
  }catch(e){
    return {};
  }
}
function saveStudyLog(log){
  localStorage.setItem(STUDY_KEY, JSON.stringify(log));
}
// 한국시간 기준 "오늘로부터 offset일"의 날짜 키 (YYYY-MM-DD)
function kstDateKeyOffset(offset){
  return new Date(Date.now() + 9*3600*1000 + offset*86400000).toISOString().slice(0,10);
}
function toggleStudyDone(lang){
  const log = loadStudyLog();
  const key = kstDateKeyOffset(0);
  const day = log[key] || {};
  day[lang] = !day[lang];
  log[key] = day;
  saveStudyLog(log);
  render();
}
// 연속 일수: 오늘이 완료 상태면 오늘부터, 아직이면 어제부터 거슬러 올라가며 센다
// (오늘 체크를 아직 안 했다는 이유만으로 스트릭이 0으로 보이는 걸 막기 위함)
function studyStreak(lang){
  const log = loadStudyLog();
  let offset = (log[kstDateKeyOffset(0)]||{})[lang] ? 0 : -1;
  let streak = 0;
  while((log[kstDateKeyOffset(offset)]||{})[lang]){
    streak++;
    offset--;
  }
  return streak;
}

// ====== 카드 접기/펼치기 (아코디언) ======
// 화면에 한 번에 보이는 정보량을 줄이기 위해 카드별로 펼침 상태를 기억한다.
// 처음 보는 카드는 defaultOpen 을 따르고, 사용자가 한 번이라도 토글하면 그 이후로는
// localStorage 값이 defaultOpen 을 덮어쓴다.
const CARD_OPEN_KEY = 'mycard_open_v1';
function loadCardOpenState(){
  try{ return JSON.parse(localStorage.getItem(CARD_OPEN_KEY)) || {}; }catch(e){ return {}; }
}
function isCardOpen(id, defaultOpen){
  const st = loadCardOpenState();
  return st.hasOwnProperty(id) ? !!st[id] : defaultOpen;
}
function toggleCard(id, defaultOpen){
  const st = loadCardOpenState();
  st[id] = !isCardOpen(id, defaultOpen);
  localStorage.setItem(CARD_OPEN_KEY, JSON.stringify(st));
  render();
}
// 카드 하나(헤더 + 접히는 본문)를 조립한다. title 은 항상 고정 문자열만 넘기고,
// sub 는 호출부에서 이미 esc() 를 거친 문자열이어야 한다(다른 렌더러들과 동일한 관례).
function cardShell(id, icon, title, sub, bodyHtml, defaultOpen){
  const open = isCardOpen(id, defaultOpen);
  return `
    <section class="card">
      <div class="card-head" role="button" tabindex="0"
        onclick="toggleCard('${id}', ${defaultOpen})"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleCard('${id}', ${defaultOpen})}">
        <span class="ico">${icon}</span>
        <span class="title">${title}</span>
        <span class="head-right">
          ${sub ? `<span class="sub">${sub}</span>` : ''}
          <span class="chevron">${open ? '▾' : '▸'}</span>
        </span>
      </div>
      ${open ? `<div class="card-body">${bodyHtml}</div>` : ''}
    </section>`;
}

// ====== 섹션 렌더러 ======
// 각 섹션은 "카드 하나"를 반환하는 함수로 분리해둔다. 카드 셸(헤더·접기 상태)은
// cardShell() 에 위임하고, 각 렌더러는 본문(bodyHtml)과 빈 상태만 책임진다.
// 이후 새 섹션도 같은 패턴으로 추가하면 된다.

// 지수 스트립 — 카드를 펼치지 않아도 헤더 바로 아래에서 3개 지수를 항상 보여준다.
// 접속 시점 실시간 시세가 있으면 그 값, 없으면 브리핑 JSON 의 종가로 폴백한다.
function renderIndexStrip(){
  const live = (state.live && state.live.indices) || [];
  const fallback = (state.briefing && state.briefing.indices) || [];
  const rows = INDICES.map(meta => {
    const row = quoteFor(live, 'name', meta.name, fallback.find(x => x.name === meta.name));
    return row ? {...row, short: meta.short} : null;
  }).filter(Boolean);
  if(!rows.length) return '';
  return rows.map(r => {
    const cls = r.up === true ? 'up' : r.up === false ? 'down' : 'flat';
    const mark = r.up === true ? '▲' : r.up === false ? '▼' : '·';
    return `
      <div class="idx-chip">
        <div class="nm">${esc(r.short || r.name)}</div>
        <div class="pr">${esc(r.price)}</div>
        <div class="pc ${cls}">${mark} ${esc(r.changePct)}</div>
      </div>`;
  }).join('');
}

function renderUSBriefing(b){
  // b: 브리핑 데이터 (없으면 null)
  // 뉴스는 접속 시점 값(state.liveNews)이 우선, 못 받았으면 브리핑 JSON 으로 폴백한다.
  // 블록 단위로 각각 판단하므로 "종목 뉴스만 실시간, 나머지는 아침 것" 같은 조합도 정상이다.
  const ln = state.liveNews;
  const ko = koMapOf(b);
  const withKo = list => (list || []).map(n => (n.ko || !ko.has(n.title)) ? n : {...n, ko: ko.get(n.title)});
  const newsList  = (ln && ln.news.length)   ? withKo(ln.news)   : ((b && b.news) || []);
  const aiList    = (ln && ln.aiNews.length) ? withKo(ln.aiNews) : ((b && b.aiNews) || []);
  const stockNews = t => (ln && ln.byTicker[t]) ? withKo(ln.byTicker[t]) : null;
  // 브리핑 파일 자체가 없어도 실시간 뉴스만으로 카드를 채울 수 있어야 한다 —
  // 새벽에 크론이 밀렸을 때 "아무것도 없는 화면" 대신 지금 뉴스라도 보이게.
  if(!b && ln && (newsList.length || aiList.length)) b = {};

  let inner;
  if(!b){
    // === 브리핑이 아직 없을 때: 빈 상태 ===
    inner = `
      <div class="empty">
        <div class="big">🌙</div>
        <div class="msg">아직 오늘 브리핑이 없어요.<br>매일 새벽 자동 생성되면 여기에 표시됩니다.</div>
        <div class="hint">미국 정규장 마감 이후 갱신됩니다.</div>
      </div>`;
  } else {
    // === 데이터가 있을 때 ===
    // 0) 낡은 값을 보고 있다면 먼저 밝힌다. 시세도 뉴스도 접속 시점에 따로 받아오므로,
    // 이 안내가 필요한 건 그 실시간 경로가 실패해 아침 브리핑으로 되돌아갔을 때뿐이다.
    const liveNewsOk = state.newsStatus === 'ok';
    const stale = (isStale() && !liveNewsOk)
      ? `<div class="stale">뉴스를 실시간으로 받지 못해 ${esc(fmtShortDate(state.shownDate))}자 브리핑을 대신 보여주고 있어요.${
          state.quoteStatus === 'ok' ? ' 시세는 방금 받아온 값입니다.' : ' 시세도 그날 종가입니다.'}</div>`
      : '';

    // 0) 오늘의 한 줄 — generate.js가 haiku로 만든 한 문장. 지수 등락률은 위 스트립이
    // 이미 보여주므로, 여기엔 "무엇이 움직였는가"만 온다. 없으면 조용히 생략.
    // 이 한 줄만은 아침 브리핑에서 올 수밖에 없다(Claude 가 쓴 문장이라 실시간 생성 불가).
    // 나머지가 실시간이면 이것만 어제 이야기가 되므로, 어느 장 이야기인지 밝혀 둔다.
    const summaryCap = (b.summary && liveNewsOk && b.sessionDateLabel)
      ? `<div class="news-date">${esc(b.sessionDateLabel)}</div>` : '';
    const summary = b.summary ? `<div class="summary">${esc(b.summary)}${summaryCap}</div>` : '';

    // 1) 관심 종목 — 시세(접속 시점 실시간, 실패 시 브리핑 값) + 종목별 관련 뉴스 최대 2건.
    // 주요 지수는 헤더 아래 스트립이 항상 띄우므로 카드 안에서 또 반복하지 않는다.
    // 팔란티어(PLTR)도 WATCH 에 들어있어 여기서 자기 뉴스를 달고 나온다(별도 섹션 아님).
    const liveStocks = (state.live && state.live.stocks) || [];
    // 브리핑 파일이 아직 없는 시간대에도 관심 종목은 나와야 하므로, 목록의 출처는
    // 브리핑 JSON → (없으면) WATCH 상수 순이다. 어느 쪽이든 시세는 실시간 값이 덮는다.
    const stockBase = (b.stocks && b.stocks.length) ? b.stocks : WATCH.map(s => ({name:s.name, ticker:s.ticker}));
    const stockRows = stockBase.map(s => {
      const q = quoteFor(liveStocks, 'ticker', s.ticker, s);
      if(q.price == null) return '';   // 브리핑도 시세도 없는 종목은 빈 줄로 남기지 않는다
      const cls = q.up === true ? 'up' : q.up === false ? 'down' : 'flat';
      const mark = q.up === true ? '▲' : q.up === false ? '▼' : '·';
      // ko(아침에 haiku 가 쓴 한국어 한 줄) → koT(접속 시점 기계 번역 제목) → 원문 순으로
      // 보여준다. 영문 원문보다 훨씬 빨리 읽히고, 원문 제목은 링크를 눌러 들어가면 어차피
      // 보인다. 둘 다 없을 때만(번역까지 실패한 경우) 원문 제목이 그대로 나온다.
      const newsLinks = (stockNews(s.ticker) || s.news || []).map(n => `
        <a href="${esc(n.link)}" target="_blank" rel="noopener" title="${esc(n.title)}">${esc(n.ko || n.koT || n.title)}${
          n.source ? `<span class="src">${esc(n.source)}</span>` : ''}</a>`).join('');
      return `
      <div class="stk">
        <div class="stk-top">
          <span class="stk-name">${esc(s.name)}<span class="tkr">${esc(s.ticker)}</span></span>
          <span class="stk-vals">
            <span class="stk-price">${esc(q.price)}</span>
            <span class="idx-chg ${cls}">${mark} ${esc(q.changePct)}</span>
          </span>
        </div>
        ${newsLinks ? `<div class="stk-news">${newsLinks}</div>` : ''}
        ${s.note ? `<div class="stk-note">${esc(s.note)}</div>` : ''}
      </div>`;
    }).join('');
    const stocks = stockRows
      ? `<div class="block"><div class="block-label">관심 종목</div>${stockRows}</div>` : '';

    // 2) 미국·글로벌 증시 동향 및 주요 뉴스 — 2026-08-05부터 Google News RSS 원문 그대로
    // (요약·번역 없음, title을 원문 기사로 가는 링크로 걸고 출처·발행일을 병기한다). 그 이전
    // 파일은 link/source 없이 Claude가 쓴 한국어 요약(body)만 있으므로, link 유무로 분기해
    // 두 스키마를 모두 그대로 보여준다(다른 필드가 없어졌다고 낡은 파일을 깨뜨리지 않는다).
    // 제목은 번역이 있으면 한국어로 건다(koT). 원문은 링크의 title 속성으로 남겨두고,
    // 링크를 따라가면 어차피 원문이 나온다 — 한 줄에 영문·국문을 같이 쌓으면 카드가 길어진다.
    const newsItems = newsList.map(n => `
      <div class="news-item">
        <div class="news-title">${n.link ? `<a href="${esc(n.link)}" target="_blank" rel="noopener" title="${esc(n.title)}">${esc(n.koT || n.title)}</a>` : esc(n.koT || n.title)}</div>
        ${(n.ko || n.body) ? `<div class="news-body">${esc(n.ko || n.body)}</div>` : ''}
        ${(n.source || n.date) ? `<div class="news-date">${esc([n.source, n.date].filter(Boolean).join(' · '))}</div>` : ''}
      </div>`).join('');
    const news = newsItems
      ? `<div class="block"><div class="block-label">주요 뉴스</div>${newsItems}</div>` : '';

    // 3) 앤트로픽 뉴스 — 별도 카드 대신 이 카드의 마지막 블록. 팔란티어는 위 관심 종목의
    // 종목별 뉴스로 옮겼으므로 여기서는 뺀다(2026-08-05 이전 파일에는 aiNews 안에 Palantir
    // 항목이 섞여 있어 company 로 걸러낸다). 2)와 동일하게 link 유무로 신·구 스키마를 분기.
    const aiNewsItems = aiList
      .filter(n => !n.company || n.company === 'Anthropic')
      .map(n => `
      <div class="news-item">
        <div class="news-title">${n.link ? `<a href="${esc(n.link)}" target="_blank" rel="noopener" title="${esc(n.title)}">${esc(n.koT || n.title)}</a>` : esc(n.koT || n.title)}</div>
        ${(n.ko || n.body) ? `<div class="news-body">${esc(n.ko || n.body)}</div>` : ''}
        ${(n.source || n.date) ? `<div class="news-date">${esc([n.source, n.date].filter(Boolean).join(' · '))}</div>` : ''}
      </div>`).join('');
    const aiNews = aiNewsItems
      ? `<div class="block"><div class="block-label">앤트로픽</div>${aiNewsItems}</div>` : '';

    inner = stale + summary + stocks + news + aiNews;
  }

  // 카드 헤더 서브텍스트. 뉴스를 실시간으로 받았다면 그 기준 시각이 사실에 맞는 표기다
  // (sessionDateLabel 은 아침 브리핑이 다룬 '마지막 정규장'이라 뉴스가 실시간이면 어긋난다).
  let subRaw = '';
  if(b){
    // 기준 시각 자체는 헤더 우측 줄(updatedText)이 이미 말한다 — 여기서 되풀이하지 않고
    // "이 카드 내용이 지금 값인가"만 알린다.
    if(state.newsStatus === 'ok' && state.liveNews) subRaw = '시세·뉴스 실시간';
    else if(isStale()) subRaw = `${fmtShortDate(state.shownDate)}자`;
    else if(b.sessionDateLabel) subRaw = b.sessionDateLabel;
    else subRaw = '어젯밤 뉴욕장';
  }

  // 이 앱의 본문에 해당하는 카드라 기본값을 '펼침'으로 둔다(다른 카드는 접힌 채 시작).
  return cardShell('us', '🇺🇸', '미국 시장 브리핑', esc(subRaw), inner, true);
}

// ====== 자산 섹션 ======
// 보유 종목은 localStorage 에만 둔다 — 저장소에 커밋되지 않으므로 공개 레포에 보유
// 내역이 남지 않는다. 시세는 이미 받아둔 Worker 값을 재사용하므로 추가 비용이 없다.
const PORTFOLIO_URL = 'https://ssangku2-tech.github.io/portfolio/';
const HOLDINGS_KEY = 'myassets_v1';     // 수동 입력 폴백 [{ticker, qty, avg}]
const PORTFOLIO_KEY = 'portfolio_v2';   // "내 주식 현황" 앱이 쓰는 키

// 포트폴리오 앱과 이 앱은 경로만 다를 뿐 같은 origin(ssangku2-tech.github.io)이라
// localStorage 를 공유한다 — 그래서 보유 종목을 따로 입력받거나 어딘가로 내보낼 필요 없이
// 그대로 읽으면 된다. 저장 구조는 그 앱의 소스 기준:
//   { accounts: { mirae1:{name,stocks:[{id,name,code,qty,avgPrice,...}],cash}, ... }, fxRate }
// 이 구조가 바뀌면 여기도 같이 바뀌어야 한다 — 남의 앱 내부 형식에 기대는 부분이다.
function toQuoteSymbol(code){
  // 포트폴리오 앱의 규칙 그대로: 국내 6자리 종목코드는 .KS 를 붙이고 해외는 티커 그대로
  return /^\d{6}$/.test(code) ? code + '.KS' : code;
}
// 포트폴리오 앱의 '종합' 탭과 같은 범위 — 그 앱의 aggregateAllStocks() 가 mirae1·mirae2 만
// 합산하고 mirae3·삼성증권은 일부러 뺀다. 그쪽 앱이 합산 대상 계좌를 바꾸면 여기도 같이 고친다.
const AGG_ACCOUNTS = ['mirae1', 'mirae2'];
// accounts 에 계좌 키 배열을 주면 그 계좌만, null 이면 전 계좌를 읽는다.
// 화면(자산 카드)은 종합 탭 범위만 쓰고, 급변동 알림 목록은 전 계좌를 쓴다 — 아래 각 호출부 참고.
// 같은 종목이 여러 계좌에 걸쳐 있으면 한 줄로 합친다(평단은 수량 가중평균).
function portfolioHoldings(accounts){
  try{
    const d = JSON.parse(localStorage.getItem(PORTFOLIO_KEY));
    if(!d || !d.accounts) return [];
    const map = new Map();
    for(const key of (accounts || Object.keys(d.accounts))){
      const acc = d.accounts[key];
      if(!acc) continue;
      for(const s of (acc.stocks || [])){
        if(!s.code || !(s.qty > 0)) continue;
        const cur = map.get(s.code) || {
          symbol: toQuoteSymbol(s.code), label: s.code, code: s.code, qty: 0, cost: 0,
        };
        cur.qty += s.qty;
        if(s.avgPrice > 0) cur.cost += s.avgPrice * s.qty;  // 평단이 없는 물량은 0원으로 친다(종합 탭과 동일)
        if(s.name) cur.label = s.name;
        map.set(s.code, cur);
      }
    }
    return [...map.values()].map(h => ({
      symbol: h.symbol, label: h.label, code: h.code, qty: h.qty,
      avg: h.cost > 0 ? h.cost / h.qty : null,
      account: '',  // 합쳐진 줄이라 계좌 이름을 붙이면 오히려 틀린 정보가 된다
    }));
  }catch(e){ return []; }
}
// 포트폴리오 앱 데이터가 있으면 그걸 쓰고, 없을 때만 수동 입력분을 쓴다.
// (같은 기기에서 포트폴리오 앱을 한 번도 안 열었으면 비어 있다 — 그때가 수동 입력 차례)
// 화면에 그리는 목록이라 종합 탭 범위만 본다.
function effectiveHoldings(){
  const p = portfolioHoldings(AGG_ACCOUNTS);
  if(p.length) return { source: 'portfolio', list: p };
  return {
    source: 'manual',
    list: loadHoldings().map(h => ({
      symbol: h.ticker, label: h.ticker, code: h.ticker, qty: h.qty, avg: h.avg, account: '',
    })),
  };
}
// 포트폴리오 앱이 캐시해 둔 환율. 없으면 Worker 에서 받은 값을 쓰고, 그것도 없으면 표기를 포기한다.
function usdKrwRate(){
  const q = (state.live && state.live.bySymbol && state.live.bySymbol['KRW=X']) || null;
  if(q && q.price > 0) return q.price;
  try{
    const d = JSON.parse(localStorage.getItem(PORTFOLIO_KEY));
    if(d && d.fxRate > 0) return d.fxRate;
  }catch(e){}
  return null;
}

function loadHoldings(){
  try{
    const v = JSON.parse(localStorage.getItem(HOLDINGS_KEY));
    return Array.isArray(v) ? v : [];
  }catch(e){ return []; }
}
function saveHoldings(list){
  localStorage.setItem(HOLDINGS_KEY, JSON.stringify(list));
}
// 폼 입력값을 state 에 들고 있는다 — render() 가 innerHTML 을 통째로 다시 그리기 때문에
// DOM 에만 있으면 자동 갱신이 한 번 돌 때 입력하던 값이 날아간다.
function onAssetInput(field, value){
  state.assetForm[field] = value;
}
function addHolding(){
  const t = (state.assetForm.ticker || '').trim().toUpperCase();
  const qty = parseFloat(state.assetForm.qty);
  const avg = parseFloat(state.assetForm.avg);
  if(!t || !isFinite(qty) || qty <= 0){
    state.assetError = '티커와 수량은 반드시 입력해야 해요.';
    render();
    return;
  }
  const list = loadHoldings().filter(h => h.ticker !== t); // 같은 티커는 덮어쓴다
  list.push({ticker: t, qty, avg: isFinite(avg) && avg > 0 ? avg : null});
  saveHoldings(list);
  state.assetForm = {ticker:'', qty:'', avg:''};
  state.assetError = '';
  loadQuotes().then(render); // 새로 추가한 티커의 시세를 받아온다
  render();
}
// 급변동 알림이 감시할 종목 목록. 화면에 그리는 목록(effectiveHoldings)과 일부러 분리해
// **전 계좌**를 본다 — 카드는 종합 탭만 보여주지만, 알림은 "값이 크게 움직였으니 가서 봐라"는
// 신호라 mirae3·삼성증권에 있는 종목이라고 안 받을 이유가 없다. 감시 대상이 늘어도
// 서버 비용은 그대로다(Worker 시세 조회뿐, LLM 호출 없음).
function alertHoldings(){
  const p = portfolioHoldings(null);   // null = 전 계좌
  return p.length ? p : effectiveHoldings().list;   // 포트폴리오 데이터가 없으면 수동 입력분
}
// 서버(Actions)는 이 기기의 localStorage 를 볼 수 없으므로, 한 번 내보내
// GitHub Secret(ALERT_SYMBOLS)에 넣어줘야 한다.
// 심볼과 표시용 이름만 담는다 — 수량·평단은 알림에 필요 없고, 넣으면 자산 규모가 드러난다.
function exportAlertSymbols(){
  const list = alertHoldings();
  if(!list.length){ state.assetError = '내보낼 보유 종목이 없어요.'; render(); return; }
  const txt = list.map(h => `${h.symbol}=${h.label}`).join(',');
  navigator.clipboard.writeText(txt)
    .then(() => { state.alertCopied = true; state.assetError = ''; render(); })
    .catch(() => { state.assetError = `복사 실패 — 직접 복사하세요: ${txt}`; render(); });
}

// 금액 펼치기/가리기. state 에만 두어 앱을 다시 열면 자동으로 다시 가려진다.
// 펼치기 전에는 포트폴리오 앱과 같은 PIN 을 받는다 — 그 앱은 PIN 잠금이 걸려 있는데
// 여기서 탭 한 번에 금액이 보이면 그 잠금이 무의미해진다.
const PIN_KEY = 'app_pin_hash_v1';  // 포트폴리오 앱이 쓰는 키 (같은 origin 이라 그대로 읽힌다)
// 해시 함수는 포트폴리오 앱의 simpleHash 와 반드시 같아야 한다 — 저장된 값은 그 앱이 만든 것이다.
// 암호학적으로 안전한 해시가 아니라는 점도 그쪽과 같다(남이 슬쩍 보는 걸 막는 수준).
function pinHash(str){
  let hash = 0;
  for(let i = 0; i < str.length; i++){
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return hash.toString() + '_' + str.length;
}
function storedPinHash(){
  try{ return localStorage.getItem(PIN_KEY) || ''; }catch(e){ return ''; }
}
function focusPin(){
  setTimeout(() => { const el = document.getElementById('pin-in'); if(el) el.focus(); }, 0);
}
function closePin(){
  state.pinPrompt = false;
  state.pinInput = '';
  state.pinError = '';
  render();
}
function toggleAssets(){
  if(state.assetsRevealed){        // 이미 보고 있으면 다시 가린다 (PIN 불필요)
    state.assetsRevealed = false;
    closePin();
    return;
  }
  if(!storedPinHash()){            // 포트폴리오 앱에서 PIN 을 설정한 적이 없으면 대조할 값이 없다
    state.assetsRevealed = true;
    render();
    return;
  }
  state.pinPrompt = true;
  state.pinInput = '';
  state.pinError = '';
  render();
  focusPin();
}
// 4자리가 채워지면 바로 대조한다. 그전에는 일부러 render() 를 부르지 않는다 —
// render() 가 innerHTML 을 통째로 갈아끼워서 한 글자마다 입력 포커스가 날아가기 때문.
function onPinInput(el){
  const v = String(el.value || '').replace(/\D/g, '').slice(0, 4);
  if(v !== el.value) el.value = v;
  state.pinInput = v;
  if(v.length < 4) return;
  if(pinHash(v) === storedPinHash()){
    state.assetsRevealed = true;
    state.pinPrompt = false;
    state.pinInput = '';
    state.pinError = '';
    render();
  } else {
    state.pinInput = '';
    state.pinError = '비밀번호가 올바르지 않습니다.';
    render();
    focusPin();
  }
}
function removeHolding(ticker){
  saveHoldings(loadHoldings().filter(h => h.ticker !== ticker));
  render();
}
// 통화에 맞춘 금액 표기. 원화는 소수점이 의미 없어 반올림한다.
function fmtMoney(v, cur){
  if(cur === 'KRW') return `${Math.round(v).toLocaleString('en-US')}원`;
  return `$${v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
}

function renderAssets(){
  const { source, list: holdings } = effectiveHoldings();
  const bySymbol = (state.live && state.live.bySymbol) || {};
  const fx = usdKrwRate();
  const masked = !state.assetsRevealed;
  // 금액 자리는 길이로도 짐작되지 않게 고정 폭으로 가린다
  const hide = txt => masked ? '●●●●●' : txt;
  const hidePl = txt => masked ? '●●●' : txt;

  // 평가금액이 큰 종목부터 내림차순. 통화가 섞여 있으면 환율로 원화 환산해 비교한다 —
  // 안 그러면 $200 짜리가 20만원짜리보다 위로 온다. 환율을 못 구했을 때(fx null)는 어쩔 수
  // 없이 원화 종목이 위로 몰리는데, 그때는 총 평가액도 통화별로 나뉘어 나오는 상황이다.
  // 시세를 못 받은 종목은 비교할 금액이 없으므로 맨 뒤로 보낸다.
  const sortValue = h => {
    const q = bySymbol[h.symbol];
    if(!q) return -1;
    return q.price * h.qty * ((q.currency || 'USD') === 'USD' ? (fx || 1) : 1);
  };
  // 원본 배열은 건드리지 않는다 — effectiveHoldings() 의 결과를 다른 곳(알림 목록)도 쓴다
  const ordered = holdings.slice().sort((a, b) => sortValue(b) - sortValue(a));

  const totals = {};
  const rows = ordered.map(h => {
    const q = bySymbol[h.symbol];
    if(!q){
      return '<div class="asset-row"><div class="asset-main">'
        + '<div class="asset-name">' + esc(h.label) + '</div>'
        + '<div class="asset-sub">' + esc(String(h.qty)) + '주 · 시세 확인 실패</div></div>'
        + (source === 'manual' ? '<button class="asset-del" onclick="removeHolding(\'' + esc(h.code) + '\')" aria-label="' + esc(h.label) + ' 삭제">✕</button>' : '')
        + '</div>';
    }
    const cur = q.currency || 'USD';
    const value = q.price * h.qty;
    const t = totals[cur] || (totals[cur] = {value:0, cost:0, valueCosted:0, missingAvg:0, dayPl:0, dayBase:0});
    t.value += value;
    // 손익률은 "평단이 있는 종목의 평가액 ÷ 그 종목들의 매입액"으로만 계산한다.
    // 전체 평가액을 일부 종목의 매입액과 비교하면 수익률이 터무니없이 부풀려진다.
    if(h.avg){ t.cost += h.avg * h.qty; t.valueCosted += value; }
    else { t.missingAvg++; }

    // 가운데 칸 — 현재가 / 전일 대비 등락률 / 당일 손익.
    // 행을 위아래로 늘리지 않으려고 새 줄을 쌓는 대신 이름과 평가액 사이의 빈 가로 공간을 쓴다.
    // 줄 수(3줄)를 오른쪽 칸과 맞춰 둔 것도 같은 이유다.
    // 당일 손익 = (현재가 − 전일종가) × 수량. 포트폴리오 앱은 '오늘 매입'한 물량만 매입가를
    // 기준으로 삼지만 여기는 그 플래그를 읽지 않으므로, 매수한 당일에는 그 앱 숫자와 다를 수 있다.
    const dayPct = q.prev > 0 ? ((q.price / q.prev) - 1) * 100 : null;
    const dayPl = dayPct === null ? null : (q.price - q.prev) * h.qty;
    // 총 평가액의 당일 합계용. 전일종가를 못 받은 종목은 아예 빼므로, 합계 비율도 받은 종목 기준이다
    if(dayPct !== null){ t.dayPl += dayPl; t.dayBase += q.prev * h.qty; }
    // 금액이라 가린다 — 등락률과 나란히 두면 수량이 역산된다
    const dayPlHtml = dayPct === null ? ''
      : '오늘 ' + hidePl((dayPl >= 0 ? '+' : '−') + esc(fmtMoney(Math.abs(dayPl), cur)));
    const dayCls = dayPct === null ? '' : (dayPct >= 0 ? 'up' : 'down');
    const midHtml = '<div class="asset-mid">'
      + '<div class="asset-price">' + esc(fmtMoney(q.price, cur)) + '</div>'
      + (dayPct === null ? '' : '<div class="asset-day ' + dayCls + '">전일 ' + (dayPct >= 0 ? '+' : '') + dayPct.toFixed(2) + '%</div>')
      // 평단이 있으면 오른쪽이 3줄이라 여기도 3줄까지 써도 행이 안 높아진다.
      // 평단이 없으면 오른쪽이 1줄뿐이라, 당일 손익을 오른쪽으로 내려 양쪽 2줄로 맞춘다.
      + (dayPct === null || !h.avg ? '' : '<div class="asset-day ' + dayCls + '">' + dayPlHtml + '</div>')
      + '</div>';

    // 오른쪽 칸 — 평가액 / 누적 손익 / 누적 수익률. 전일 대비는 가운데 칸으로 옮겼다.
    let deltaHtml;
    if(h.avg){
      const pl = (q.price - h.avg) * h.qty;
      const pct = ((q.price / h.avg) - 1) * 100;
      const cls = pl >= 0 ? 'up' : 'down';
      deltaHtml = '<div class="asset-pl ' + cls + '">' + hidePl((pl >= 0 ? '+' : '−') + esc(fmtMoney(Math.abs(pl), cur))) + '</div>'
        + '<div class="asset-pct ' + cls + '">' + (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%</div>';
    } else {
      deltaHtml = dayPlHtml ? '<div class="asset-pl ' + dayCls + '">' + dayPlHtml + '</div>' : '';
    }
    return '<div class="asset-row"><div class="asset-main">'
      + '<div class="asset-name">' + esc(h.label) + '</div>'
      + '<div class="asset-sub">' + (masked ? '●●' : esc(String(h.qty))) + '주'
      + (h.account ? ' · ' + esc(h.account) : '') + '</div></div>'
      + midHtml
      + '<div class="asset-vals"><div class="asset-value">' + hide(esc(fmtMoney(value, cur))) + '</div>' + deltaHtml + '</div>'
      + (source === 'manual' ? '<button class="asset-del" onclick="removeHolding(\'' + esc(h.code) + '\')" aria-label="' + esc(h.label) + ' 삭제">✕</button>' : '')
      + '</div>';
  }).join('');

  // 통화가 섞여도 환율이 있으면 원화 한 줄로 합친다. 못 구하면 통화별로 따로 보여준다.
  const curs = Object.keys(totals);
  const canMerge = fx && curs.every(c => c === 'KRW' || c === 'USD');
  // t 는 위에서 통화별로 쌓은 {value, cost, valueCosted, missingAvg, dayPl, dayBase} 그대로다.
  // 두 손익을 나란히 쌓으므로 각 줄에 '오늘'/'누적' 을 붙인다 — 안 붙이면 어느 쪽인지 알 수 없다.
  const totalBlock = (label, t, cur) => {
    const pl = t.cost > 0 ? t.valueCosted - t.cost : null;
    const pct = t.cost > 0 ? ((t.valueCosted / t.cost) - 1) * 100 : null;
    const cls = pl === null ? '' : (pl >= 0 ? 'up' : 'down');
    const dayPct = t.dayBase > 0 ? (t.dayPl / t.dayBase) * 100 : null;
    const dayCls = t.dayPl >= 0 ? 'up' : 'down';
    return '<div class="asset-total"><span class="asset-total-label">' + label + '</span>'
      + '<span class="asset-total-vals">'
      + '<span class="asset-total-value">' + hide(esc(fmtMoney(t.value, cur))) + '</span>'
      + (dayPct === null ? '' : '<span class="asset-total-pl ' + dayCls + '">오늘 '
          + hidePl((t.dayPl >= 0 ? '+' : '−') + esc(fmtMoney(Math.abs(t.dayPl), cur)))
          + ' (' + (dayPct >= 0 ? '+' : '') + dayPct.toFixed(2) + '%)</span>')
      + (pl === null ? '' : '<span class="asset-total-pl ' + cls + '">누적 '
          + hidePl((pl >= 0 ? '+' : '−') + esc(fmtMoney(Math.abs(pl), cur)))
          + ' (' + (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%)</span>')
      + (t.missingAvg ? '<span class="asset-total-note">누적은 평단 입력분 기준</span>' : '')
      + '</span></div>';
  };
  let totalRows = '';
  if(canMerge && curs.length){
    const k = c => (c === 'USD' ? fx : 1);
    const m = {value:0, cost:0, valueCosted:0, missingAvg:0, dayPl:0, dayBase:0};
    for(const c of curs){
      const t = totals[c], r = k(c);
      m.value += t.value * r; m.cost += t.cost * r; m.valueCosted += t.valueCosted * r;
      m.dayPl += t.dayPl * r; m.dayBase += t.dayBase * r; m.missingAvg += t.missingAvg;
    }
    totalRows = totalBlock('총 평가액', m, 'KRW');
  } else {
    totalRows = curs.map(c => totalBlock('총 평가액' + (curs.length > 1 ? ' (' + esc(c) + ')' : ''),
      totals[c], c)).join('');
  }

  const empty = '<div class="empty"><div class="big">💰</div>'
    + '<div class="msg">보유 종목이 없어요.<br>포트폴리오 앱 <b>종합</b> 탭의 종목이 여기 나타납니다.</div>'
    + '<div class="hint">같은 기기에서 포트폴리오 앱을 한 번 열어주세요.</div></div>';

  // 금액 가리기 — 기본은 가려두고, 펼칠 때는 포트폴리오 앱과 같은 PIN 을 받는다(toggleAssets).
  // 펼침 상태는 localStorage 에 남기지 않는다 — 앱을 다시 열면 다시 가려져야 의미가 있다.
  // 가릴 때는 PIN 을 묻지 않고, 다시 펼치려면 또 입력해야 한다(설치형 PWA 는 며칠씩 떠 있어서
  // "이번 세션은 통과" 로 두면 잠금이 사실상 풀린 채로 남는다).
  const revealBtn = !holdings.length || state.pinPrompt ? ''
    : '<button class="asset-reveal" onclick="toggleAssets()">' + (masked ? '🔒 금액 보기' : '가리기') + '</button>';
  const pinBox = state.pinPrompt
    ? '<div class="pin-box"><div class="pin-label">포트폴리오 앱 비밀번호 4자리</div>'
      + '<div class="pin-row">'
      + '<input class="pin-in" id="pin-in" type="password" inputmode="numeric" autocomplete="off" maxlength="4"'
      + ' placeholder="••••" value="' + esc(state.pinInput) + '" oninput="onPinInput(this)">'
      + '<button class="pin-cancel" onclick="closePin()">취소</button></div>'
      + (state.pinError ? '<div class="pin-err">' + esc(state.pinError) + '</div>' : '')
      + '</div>'
    : '';

  // 급변동 알림용 종목 목록 내보내기. 종목을 추가·삭제하면 다시 내보내야 한다.
  // 이 목록만 전 계좌를 본다(alertHoldings) — 그래서 위 목록보다 종목 수가 많을 수 있고,
  // 버튼에 그 수를 적어 둔다. 안 그러면 "3종목인데 왜 5개가 복사되지?" 가 된다.
  const alertList = alertHoldings();
  const alertBtn = alertList.length
    ? '<button class="asset-reveal" onclick="exportAlertSymbols()">'
      + (state.alertCopied
          ? '복사됨 ✓ — GitHub Secret ALERT_SYMBOLS 에 붙여넣기'
          : '급변동 알림 종목 내보내기 (전 계좌 ' + alertList.length + '종목)')
      + '</button>' : '';

  const err = state.assetError ? '<div class="stale">' + esc(state.assetError) + '</div>' : '';
  // 수동 입력 폼은 포트폴리오 데이터가 없을 때만 — 있으면 그쪽이 원본이라 여기서 고칠 일이 없다
  const form = source === 'manual'
    ? '<div class="asset-form">'
      + '<input class="asset-in" placeholder="티커" value="' + esc(state.assetForm.ticker) + '" oninput="onAssetInput(\'ticker\', this.value)" autocapitalize="characters">'
      + '<input class="asset-in" placeholder="수량" inputmode="decimal" value="' + esc(state.assetForm.qty) + '" oninput="onAssetInput(\'qty\', this.value)">'
      + '<input class="asset-in" placeholder="평단(선택)" inputmode="decimal" value="' + esc(state.assetForm.avg) + '" oninput="onAssetInput(\'avg\', this.value)">'
      + '<button class="asset-add" onclick="addHolding()">추가</button></div>'
    : '';

  const jumpSub = source === 'portfolio' ? '계좌별 현황 · 종목 추가·수정' : '계좌별 현황 · 전체 내역';
  // 알림 버튼은 카드가 빈 상태여도(종합 탭에 종목이 없고 다른 계좌에만 있을 때) 나와야 하므로
  // 목록 분기 바깥에 둔다.
  const inner = (holdings.length ? totalRows + rows + revealBtn + pinBox : empty) + alertBtn + err + form
    + '<a class="jump" href="' + PORTFOLIO_URL + '" target="_blank" rel="noopener" style="margin-top:12px">'
    + '<div class="jump-main"><div class="jump-title">포트폴리오 앱에서 자세히 보기</div>'
    + '<div class="jump-sub">' + jumpSub + '</div></div><span class="jump-arrow">→</span></a>';

  // 부제에는 금액을 절대 넣지 않는다 — 카드를 접어둬도 보이는 자리다
  const sub = holdings.length
    ? (source === 'portfolio' ? '종합 ' : '') + holdings.length + '종목' : '';
  return cardShell('assets', '💰', '내 자산', esc(sub), inner, holdings.length > 0);
}
